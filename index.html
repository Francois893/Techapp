const FAMILIES=[['encolleurs','▣','Encolleurs','Micron+ · B4'],['tuyaux','〰','Tuyaux','Arion · Longueurs'],['applicateurs','⚒','Applicateurs','MU · NC · Microprecision'],['accessoires','⚙','Accessoires','Chargeurs · Starbi · Trolley · Raptor'],['buses','◈','Buses','STF · RA · FMM'],['pieces','▤','Pièces détachées','Recherche par machine et référence']];
const blank=()=>({clients:[],interventions:[],objectifs:[],offers:[],stocks:[],catalog:[],technicians:TECHS.map(name=>({name,photo:'',home:'',departure:'home',arrival:'home'})),officeAddress:''});
let db;try{db=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{db=blank()}
let interventionPhotosDraft=null;let offerDraft=null,offerStep=1,offerSearch='';let page='accueil',modal=null,query='',filters={types:['Installation'],status:'Tous',month:'Tous',cat:'Tous'},stockOwner='Bureau',configFamily='',calMode='month',calDate=new Date(),role='admin',selectedTech='François',mobileMenu=false,previousPage='accueil',tourWeek=new Date(),tourSelected='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Stockage du navigateur saturé. Exportez vos données avant de continuer.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}
function toDateTime(s){return !s?'':s.length===10?s+'T09:00':s.slice(0,16)}
function dateFR(s){if(!s)return 'Non renseignée';let d=new Date(s.length===10?s+'T12:00:00':s);return Number.isNaN(+d)?esc(s):d.toLocaleDateString('fr-FR')}
function dateISO(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function uid(){return (crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2))}
function setPage(p){if(page!==p)previousPage=page;page=p;query='';modal=null;mobileMenu=false;render()}

function render(){document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="icon-180.png" alt="" style="width:35px;height:35px;vertical-align:middle;border-radius:8px;margin-right:8px">MELER <b>∿</b><small>TECHAPP · SERVICE TECHNIQUE</small></div>${navHtml()}<div class="sidefoot">Prototype local · sans synchronisation</div></aside><main class="main"><header class="top"><div class="top-left"><button class="top-nav" title="Retour" onclick="setPage(previousPage)">←</button><button class="top-nav" title="Accueil" onclick="setPage('accueil')">⌂</button><div><div style="font-weight:900;font-size:18px">${NAV.find(n=>n[0]===page)?.[2]||'TechApp'}</div></div></div><div class="topright"><span class="chip">● Interface locale</span><button class="btn secondary small" onclick="openSettings()">⚙ Profil</button><button class="btn secondary small menuMobile" onclick="mobileMenu=!mobileMenu;render()">☰</button></div></header><div class="content">${screen()}</div></main><nav class="bottomnav">${NAV.filter(n=>BOTTOM.includes(n[0])).map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="setPage('${id}')"><span class="ico">${icon(id)}</span>${label}</button>`).join('')}</nav></div>${mobileMenu?`<div class="mobile-menu-backdrop" onclick="mobileMenu=false;render()"><aside class="mobile-menu-panel" onclick="event.stopPropagation()"><div class="mobile-menu-head"><span>TechApp · Navigation</span><button class="top-nav" aria-label="Fermer le menu" onclick="mobileMenu=false;render()">✕</button></div>${NAV.map(([id,ic,label])=>`<button class="navbtn ${page===id?'active':''}" onclick="setPage('${id}')"><span class="ico">${icon(id)}</span><span class="navlabel">${label}</span></button>`).join('')}<button class="navbtn" onclick="mobileMenu=false;openSettings()"><span class="ico">⚙</span><span class="navlabel">Paramètres</span></button></aside></div>`:''}${modal?modalHTML():''}`;if(page==='carte')setTimeout(()=>initFranceMap(),0);if(page==='tournee')setTimeout(()=>initTourMap(),0)}
function hero(title,desc){return ''}
function stat(label,value){return `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`}
function searchBar(placeholder='Rechercher...'){return `<input aria-label="Rechercher" placeholder="⌕  ${placeholder}" value="${esc(query)}" oninput="query=this.value;refreshContent()">`}
function refreshContent(){let el=document.querySelector('.content');if(el)el.innerHTML=screen()}
function canEdit(){return role==='admin'}
function screen(){switch(page){case'accueil':return home();case'objectif':return objective();case'clients':return clients();case'interventions':return interventions();case'offres':return offers();case'materiel':return stocks();case'configurateur':return configurator();case'calendrier':return calendar();case'carte':return mapPage();case'tournee':return tournee();default:return home()}}
function home(){const tiles=[['objectif','Objectif'],['clients','Clients'],['interventions','Interventions'],['offres','Offres'],['materiel','Matériel'],['calendrier','Calendrier'],['carte','Carte'],['configurateur','Configurateur'],['tournee','Tournée']];return `<div class="home-new"><div class="home-logo"><img src="icon-180.png" alt="Logo TechApp"></div><div class="home-grid">${tiles.map(([id,label])=>`<button class="home-tile" onclick="setPage('${id}')">${icon(id)}<strong>${label}</strong></button>`).join('')}</div></div>`}

function objective(){let total=db.objectifs.length,done=db.objectifs.filter(o=>o.ordered),ongoing=db.objectifs.filter(o=>!o.ordered).reduce((s,o)=>s+Number(o.amount||0),0),ordered=done.reduce((s,o)=>s+Number(o.amount||0),0);let list=db.objectifs.filter(o=>(o.client+' '+o.number+' '+o.type).toLowerCase().includes(query.toLowerCase())&&(filters.month==='Tous'||o.month===filters.month));return `${hero('Objectif','Suivi de tes offres réalisées, sans cible commerciale imposée.')}<div class="grid">${stat('Total offres',total)}${stat('Montant offres en cours',money(ongoing))}${stat('Offres transformées',done.length)}${stat('Montant commandé',money(ordered))}</div><div class="card" style="margin-top:15px"><strong>Taux de transformation : ${total?(done.length/total*100).toFixed(1).replace('.',','):'0,0'} %</strong></div><div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Offres enregistrées</h2><button class="btn secondary" onclick="exportObjectives()">↓ Export Excel</button><button class="btn" onclick="openForm('objective')">+ Ajouter</button></div><div class="toolbar">${searchBar('Client ou n° offre')}<select style="max-width:190px" onchange="filters.month=this.value;refreshContent()"><option>Tous</option>${MONTHS.map(m=>`<option ${filters.month===m?'selected':''}>${m}</option>`).join('')}</select></div>${list.length?list.map(o=>`<div class="item"><span class="dot ${o.ordered?'green':'red'}"></span><div class="itembody"><strong>${esc(o.client)} / ${esc(o.type)}</strong><small>${esc(o.number)} · ${esc(o.month)} · ${money(o.amount)}</small></div><div class="actions"><button class="btn small ${o.ordered?'secondary':''}" onclick="toggleOrdered('${o.id}')">${o.ordered?'✓ Commandé':'Commandé'}</button><button class="btn secondary small" onclick="openForm('objective','${o.id}')">✎</button><button class="btn danger small" onclick="removeItem('objectifs','${o.id}')">×</button></div></div>`).join(''):`<div class="empty">Aucune offre enregistrée. Ajoute ta première offre pour commencer le suivi.</div>`}</div>`}
function toggleOrdered(id){let o=db.objectifs.find(x=>x.id===id);if(o){o.ordered=!o.ordered;save();render()}}
function clients(){let list=db.clients.filter(c=>Object.values(c).join(' ').toLowerCase().includes(query.toLowerCase()));return `${hero('Clients','Répertoire client partagé et informations utiles pour les interventions.') }<div class="card"><div class="toolbar">${searchBar('Nom, ville, code postal...')}${canEdit()?`<button class="btn" onclick="openForm('client')">+ Ajouter un client</button>`:''}</div>${list.length?list.map(c=>`<div class="item"><div class="avatar">♙</div><div class="itembody"><strong>${esc(c.name)}</strong><small>${esc(c.zip)} ${esc(c.city)} · ${esc(c.type||'')}</small></div><button class="btn secondary small" onclick="openForm('client','${c.id}')">Voir ${canEdit()?' / modifier':''}</button></div>`).join(''):`<div class="empty">Aucun client. Les clients créés apparaîtront ici.</div>`}</div>`}
function techAvatar(name){let t=db.technicians.find(x=>x.name===name);return `<div class="avatar">${t?.photo?`<img src="${esc(t.photo)}" alt="Photo de ${esc(name)}">`:'♙'}</div>`}
function interventions(){let list=db.interventions.filter(i=>filters.types.includes(i.type)&&(i.client+' '+i.zip+' '+i.tech+' '+i.comment).toLowerCase().includes(query.toLowerCase()));return `${hero('Interventions','Organisation des installations, assistances, audits et travaux atelier.') }<div class="card"><div class="toolbar">${searchBar('Client, technicien, commentaire...')}${canEdit()?`<button class="btn" onclick="openForm('intervention')">+ Intervention</button>`:''}</div><div class="typefilters">${TYPES.map(t=>`<button class="pilltoggle" onclick="toggleType('${t}')"><span class="type-label">${t}</span><span class="switch ${filters.types.includes(t)?'on':''}"></span></button>`).join('')}</div>${TYPES.filter(t=>filters.types.includes(t)).map(t=>`<h2 class="sectiontitle">${t}</h2>${STATUSES.map(s=>{let rows=list.filter(i=>i.type===t&&i.status===s);return rows.length?`<div style="margin:15px 0"><strong style="font-size:13px;color:#506674">${s} (${rows.length})</strong>${rows.map(i=>`<div class="item">${techAvatar(i.tech)}<div class="itembody"><strong>${esc(i.client||'Client non renseigné')} / ${esc(i.zip||'')}</strong><small><span class="dot ${i.contacted?'green':''}"></span>${esc(s)}${i.start?' · '+dateFR(i.start):''} ${i.tech?' · '+esc(i.tech):''}</small></div><div class="actions">${(canEdit()||i.tech===selectedTech)?`<button class="btn small secondary" onclick="toggleContact('${i.id}')">${i.contacted?'✓ Contacté':'Contacter'}</button>`:''}<button class="btn secondary small" onclick="openForm('intervention','${i.id}')">Détails</button></div></div>`).join('')}</div>`:''}).join('')}${!list.some(i=>i.type===t)?`<div class="empty">Aucune intervention dans cette catégorie</div>`:''}`).join('')}${filters.types.length===0?'<div class="empty">Active au moins un type d’intervention.</div>':''}</div>`}
function toggleType(t){filters.types=filters.types.includes(t)?filters.types.filter(x=>x!==t):[...filters.types,t];render()}
function toggleContact(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;if(!canEdit()&&i.tech!==selectedTech)return alert('Cette intervention est affectée à un autre technicien.');i.contacted=!i.contacted;save();render()}
const OFFER_PARTS=[{ref:'10100070',name:'Filtre cuve B4',category:'B4'}];
function startOffer(id){let old=db.offers.find(o=>o.id===id);offerDraft=old?JSON.parse(JSON.stringify(old)):{client:'',distance:'',bacs:1,parts:[]};offerStep=1;offerSearch='';page='offres';render()}
function updateOfferField(k,v){if(offerDraft)offerDraft[k]=v}
function offerNext(){if(offerStep===1){let c=document.getElementById('offer-client'),d=document.getElementById('offer-distance'),n=document.getElementById('offer-bacs');offerDraft.client=c.value;offerDraft.distance=d.value;offerDraft.bacs=Number(n.value);if(!offerDraft.client||d.value===''||Number(d.value)<0||!Number.isInteger(offerDraft.bacs)||offerDraft.bacs<1){alert('Renseigne le client, la distance et le nombre de bacs.');return}}offerStep=Math.min(3,offerStep+1);render()}

function saveOfferDraft(){if(!offerDraft)return;let o={...offerDraft,id:offerDraft.id||uid(),distance:Number(offerDraft.distance),bacs:Number(offerDraft.bacs)};let old=db.offers.find(x=>x.id===o.id);if(old)Object.assign(old,o);else db.offers.push(o);save();offerDraft=null;offerStep=1;render();return o.id}

raft.parts.length?offerDraft.parts.map(p=>`<div class="item"><div class="itembody"><strong>${esc(p.name)}</strong><small>${esc(p.ref)}</small></div><strong>× ${p.qty}</strong></div>`).join(''):'<div class="notice warning">Aucune pièce ajoutée. Vérifie avant d’envoyer.</div>'}<div class="notice">« Envoyer » ouvre ta messagerie avec un e-mail préparé pour Silvia. Aucun envoi automatique.</div>`}<div class="wizardactions">${offerStep>1?`<button class="btn secondary" onclick="offerBack()">← Précédent</button>`:'<button class="btn secondary" onclick="offerDraft=null;render()">Annuler</button>'}<div style="flex:1"></div>${offerStep<3?`<button class="btn" onclick="offerNext()">Suivant →</button>`:`<button class="btn secondary" onclick="saveOfferDraft()">Enregistrer</button><button class="btn" onclick="sendOfferDraft()">✉ Envoyer</button>`}</div></div>`}
function offers(){if(offerDraft)return `${hero('Offres','Demande de maintenance en trois étapes.')}${offerWizard()}`;return `${hero('Offres','Préparer les demandes de contrat de maintenance préventive.') }<div class="card"><div class="toolbar"><h2 style="flex:1;margin:0">Demandes de maintenance</h2><button class="btn" onclick="startOffer()">+ Nouvelle demande</button></div><div class="notice">Parcours : informations client → catalogue de pièces et quantités → résumé et e-mail.</div>${db.offers.length?db.offers.map(o=>`<div class="item"><div class="avatar">✉</div><div class="itembody"><strong>${esc(o.client)}</strong><small>${o.bacs} bac(s) · ${o.distance} km · ${esc(zone(o.distance).name)} · ${money(unitPrice(o.distance,o.bacs))} / bac</small></div><div class="actions"><button class="btn small" onclick="emailOffer('${o.id}')">✉ Mail</button><button class="btn secondary small" onclick="startOffer('${o.id}')">Modifier</button></div></div>`).join(''):'<div class="empty">Aucune demande créée.</div>'}</div>`}
function zone(distance){let d=Number(distance);return d<50?{name:'Zone proche',ref:'80000002',price:414.15}:d<=200?{name:'Zone moyenne',ref:'80000003',price:526.15}:{name:'Zone éloignée',ref:'80000004',price:821.15}}
function unitPrice(d,n){let z=zone(d),qty=Math.max(1,Number(n)||1);return Math.round(z.price*(1+.6*(qty-1))/qty*100)/100}
function emailOffer(id){let o=db.offers.find(x=>x.id===id);if(!o)return;let z=zone(o.distance),parts=(o.parts||[]).map(p=>`${p.qty} x ${p.ref} : ${p.name}`).join('\n');let subject=`Offre Contrat de maintenance préventive : ${o.client}`;let body=`Bonjour Silvia,\n\nPourrais tu établir une offre pour ${o.client} :\n\n"Contrat de maintenance sans engagement :"\n\n${z.name} :\n\n${o.bacs} x ${z.ref} : ${unitPrice(o.distance,o.bacs).toFixed(2).replace('.',',')} € / unité\n\n${parts}\n\nMerci\n\nPour info :\nContrat incluant environ ${Number(o.bacs)*3} heure(s) de m.o\n\nCordialement`;location.href=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}
function stocks(){let owners=['Bureau',...TECHS],list=db.stocks.filter(s=>s.owner===stockOwner&&(s.number+' '+s.short+' '+s.long).toLowerCase().includes(query.toLowerCase()));return `${hero('Matériel','Inventaires indépendants, stock minimum et réapprovisionnement.') }<div class="tabs">${owners.map(o=>`<button class="tab ${stockOwner===o?'active':''}" onclick="stockOwner='${o}';render()">${esc(o)}</button>`).join('')}</div><div class="card"><div class="toolbar">${searchBar('Référence ou désignation')}<button class="btn" onclick="openForm('stock')">+ Ajouter une pièce</button></div>${list.length?list.map(s=>`<div class="item"><div class="avatar">▣</div><div class="itembody"><strong>${esc(s.number)} · ${esc(s.short)}</strong><small>Stock : ${Number(s.qty)||0} · Minimum : ${Number(s.min)||0}${s.modified?` · Avant : ${s.previous} · ${new Date(s.modified).toLocaleString('fr-FR')}`:''}</small>${Number(s.qty)<Number(s.min)?'<span class="tag orange">Stock sous le minimum</span>':''}</div><div class="actions"><button class="btn secondary small" onclick="changeQty('${s.id}',-1)">−</button><strong>${Number(s.qty)||0}</strong><button class="btn secondary small" onclick="changeQty('${s.id}',1)">+</button><button class="btn secondary small" onclick="openForm('stock','${s.id}')">✎</button>${Number(s.qty)<Number(s.min)?`<button class="btn small" onclick="reorder('${s.id}')">✉</button>`:''}</div></div>`).join(''):'<div class="empty">Aucune pièce dans cet inventaire.</div>'}</div>`}
function changeQty(id,delta){let s=db.stocks.find(x=>x.id===id);if(!s)return;if(role!=='admin'&&s.owner!==selectedTech)return alert('Inventaire non autorisé.');let next=Math.max(0,Number(s.qty||0)+delta);if(next===Number(s.qty||0))return;s.previous=Number(s.qty||0);s.qty=next;s.modified=new Date().toISOString();save();render()}

function configurator(){if(!configFamily)return `${hero('Configurateur Meler','Choisis une famille d’équipements. Le parcours « Installation standard » est volontairement exclu.') }<div class="grid">${FAMILIES.map(([id,ic,name,sub])=>`<button class="category" onclick="configFamily='${id}';render()"><span class="symbol">${ic}</span><strong>${name}</strong><small>${sub}</small></button>`).join('')}</div><div class="notice warning">Les références et compatibilités officielles doivent être renseignées ou importées avant toute utilisation commerciale. Aucune référence produit n'est inventée.</div>`;let f=FAMILIES.find(x=>x[0]===configFamily),list=db.catalog.filter(x=>x.family===configFamily&&(x.name+' '+x.ref+' '+x.description).toLowerCase().includes(query.toLowerCase()));return `${hero(f[2],f[3])}<div class="toolbar"><button class="btn secondary" onclick="configFamily='';render()">← Toutes les familles</button>${searchBar('Référence, modèle, caractéristique')}<button class="btn" onclick="openForm('product')">+ Ajouter une référence</button></div>${configFamily==='encolleurs'?`<div class="tabs"><span class="tag">Micron+ · Piston / Engrenage</span><span class="tag">B4 · Piston / Engrenage / NS</span></div>`:''}${configFamily==='tuyaux'?`<div class="notice">Règles de sélection à respecter : Ø intérieur 8 mm par défaut pour colle standard ; Ø 13 mm pour PUR. Vérifier les compatibilités de chaque référence.</div>`:''}${configFamily==='buses'?`<div class="notice">Filtres métier : cordon, point, fibérisation, diamètre, angle, nombre d'orifices et compatibilité applicateur.</div>`:''}<div class="productlist">${list.map(p=>`<div class="product"><div class="art">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" style="max-width:100%;max-height:100%;object-fit:contain">`:'⚙'}</div><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="tag">${esc(p.ref||'Référence à compléter')}</div><div class="toolbar"><button class="btn small secondary" onclick="openForm('product','${p.id}')">Détails / modifier</button></div></div>`).join('')}</div>${!list.length?`<div class="empty">Aucune référence importée pour cette famille. Ajoute tes données réelles pour alimenter le configurateur.</div>`:''}`}
function calendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),start=new Date(y,m,1),first=(start.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let entries=db.interventions.filter(i=>['À planifier','Planifié'].includes(i.status));function events(d){let day=dateISO(d);return entries.filter(i=>i.start&&day>=i.start.slice(0,10)&&day<=(i.end||i.start).slice(0,10))}let monthCells=Array.from({length:Math.ceil((first+days)/7)*7},(_,n)=>{let d=new Date(y,m,n-first+1);return `<div class="calday ${d.getMonth()!==m?'muted':''}"><strong>${d.getDate()}</strong>${events(d).map(i=>`<div class="event" style="--tech-color:${TECH_COLORS[i.tech]||'#85929b'}" title="${esc(i.client)}" onclick="openForm('intervention','${i.id}')">${i.contacted?'✓ ':''}${esc(i.client)}</div>`).join('')}</div>`}).join('');let monday=new Date(calDate);monday.setDate(calDate.getDate()-(calDate.getDay()+6)%7);return `${hero('Calendrier','Vue mensuelle ou planning hebdomadaire par technicien, sans glisser-déposer.') }<div class="card"><div class="tech-legend">${TECHS.map(t=>`<span><i style="background:${TECH_COLORS[t]}"></i>${esc(t)}</span>`).join('')}</div><div class="toolbar"><button class="btn secondary small" onclick="moveCal(-1)">←</button><strong style="flex:1;text-align:center">${calMode==='month'?MONTHS[m]+' '+y:'Semaine du '+dateFR(dateISO(monday))}</strong><button class="btn secondary small" onclick="moveCal(1)">→</button><button class="btn secondary small" onclick="calDate=new Date();render()">Aujourd'hui</button><button class="btn ${calMode==='month'?'':'secondary'} small" onclick="calMode='month';render()">Mois</button><button class="btn ${calMode==='week'?'':'secondary'} small" onclick="calMode='week';render()">Semaine</button></div>${calMode==='month'?`<div class="calgrid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div style="text-align:center;font-size:12px;font-weight:700;padding:7px">${x}</div>`).join('')}${monthCells}</div>`:`<div class="weekscroll"><table class="weektable"><tr><th>Technicien</th>${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);return `<th>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][n]} ${d.getDate()}</th>`}).join('')}</tr>${TECHS.map(t=>`<tr><th>${esc(t)}</th>${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);return `<td>${events(d).filter(i=>i.tech===t).map(i=>`<div class="event" style="--tech-color:${TECH_COLORS[i.tech]||'#85929b'}" onclick="openForm('intervention','${i.id}')">${esc(i.client)}</div>`).join('')}</td>`}).join('')}</tr>`).join('')}</table></div><div class="weekmobile">${TECHS.map(t=>`<section class="techweek"><h3 style="color:${TECH_COLORS[t]}">${esc(t)}</h3><div class="weekdays">${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);let es=events(d).filter(i=>i.tech===t);return `<div class="weekday"><div class="dayhead">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][n]} <b>${d.getDate()}</b></div><div class="dayevents">${es.length?es.map(i=>`<button class="wevent" style="--tech-color:${TECH_COLORS[i.tech]||'#85929b'}" onclick="openForm('intervention','${i.id}')">${i.contacted?'✓ ':''}${esc(i.client)}</button>`).join(''):'<span class="nodate">—</span>'}</div></div>`}).join('')}</div></section>`).join('')}</div>`}</div>`}
function moveCal(delta){if(calMode==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()+delta,1);else{calDate=new Date(calDate);calDate.setDate(calDate.getDate()+7*delta)}render()}
function mapPage(){let list=db.interventions.filter(i=>['À planifier','Planifié'].includes(i.status)&&i.type!=='Atelier');return `${hero('Carte de France','Interventions positionnées selon les adresses des fiches clients.') }<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Localisation des clients</h2><button class="btn secondary small" onclick="initFranceMap(true)">↻ Actualiser les positions</button></div><div id="france-map" role="application" aria-label="Carte de France avec interventions"></div><p class="footnote" id="map-info">Carte OpenStreetMap. Les adresses des clients sont géocodées via Nominatim lors de l’affichage, puis mises en cache dans ce navigateur. Connexion Internet nécessaire.</p></div><div class="card"><h2>Interventions à localiser (${list.length})</h2>${list.map(i=>{let c=db.clients.find(c=>c.name===i.client);let a=[c?.address,c?.zip,c?.city].filter(Boolean).join(', ');return `<div class="item"><span class="dot ${i.status==='Planifié'?'green':''}"></span><div class="itembody"><strong>${esc(i.client)}</strong><small>${esc(i.status)} · ${esc(a||'Adresse client non renseignée')}</small></div><button class="btn secondary small" onclick="openForm('intervention','${i.id}')">Détails</button></div>`}).join('')||'<div class="empty">Aucune intervention planifiée ou à planifier.</div>'}</div>`}
let franceMap=null;async function initFranceMap(force=false){let el=document.getElementById('france-map');if(!el||typeof L==='undefined'){if(el)el.textContent='Carte indisponible hors connexion.';return}if(franceMap){franceMap.remove();franceMap=null}franceMap=L.map(el).setView([46.6,2.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(franceMap);let cache={};try{cache=JSON.parse(localStorage.getItem('techapp-geocodes')||'{}')}catch{}let items=db.interventions.filter(i=>['À planifier','Planifié'].includes(i.status)&&i.type!=='Atelier');let points=[];let count=0;for(let i of items){if(page!=='carte')break;let c=db.clients.find(c=>c.name===i.client);let addr=[c?.address,c?.zip,c?.city].filter(Boolean).join(', ');if(!addr)continue;let pos=cache[addr];if(!pos||force){try{await new Promise(r=>setTimeout(r,1100));let response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(addr));if(!response.ok)continue;let results=await response.json();if(!results.length)continue;pos=[Number(results[0].lat),Number(results[0].lon)];cache[addr]=pos;localStorage.setItem('techapp-geocodes',JSON.stringify(cache))}catch{continue}}let marker=L.circleMarker(pos,{radius:9,color:'#fff',weight:2,fillColor:i.status==='Planifié'?'#1caa79':'#ed9a26',fillOpacity:1}).addTo(franceMap);let node=document.createElement('div');let title=document.createElement('strong');title.textContent=i.client;node.append(title,document.createElement('br'),document.createTextNode(i.status+' · '+i.type),document.createElement('br'));let btn=document.createElement('button');btn.textContent='Ouvrir la fiche';btn.onclick=()=>openForm('intervention',i.id);node.append(btn);marker.bindPopup(node);points.push(pos);count++}if(points.length>1)franceMap.fitBounds(points,{padding:[35,35],maxZoom:9});else if(points.length===1)franceMap.setView(points[0],10);let info=document.getElementById('map-info');if(info)info.textContent=count+' intervention(s) localisée(s) sur '+items.length+'. Orange : à planifier · Vert : planifiée. Les adresses sont transmises à OpenStreetMap/Nominatim pour localisation.'}

let tourMap=null;let tourLayers=[];

function tournee(){let mon=mondayOf(tourWeek),sun=new Date(mon);sun.setDate(mon.getDate()+6);let visible=role==='admin'?TECHS:[selectedTech];if(role!=='admin')tourSelected=selectedTech;let chosen=role==='admin'?(tourSelected==='all'?visible:[tourSelected]):visible;let week=db.interventions.filter(i=>i.start&&i.status==='Planifié'&&i.type!=='Atelier'&&i.start.slice(0,10)<=dateISO(sun)&&(i.end||i.start).slice(0,10)>=dateISO(mon)&&chosen.includes(i.tech));return `<div class="card"><h2>Tournée · ${dateFR(dateISO(mon))} au ${dateFR(dateISO(sun))}</h2><div class="toolbar"><button class="btn secondary small" onclick="tourMove(-1)">← Semaine</button><button class="btn secondary small" onclick="tourWeek=new Date();render()">Cette semaine</button><button class="btn secondary small" onclick="tourMove(1)">Semaine →</button>${role==='admin'?`<select style="max-width:220px" onchange="tourSelected=this.value;render()"><option value="all" ${tourSelected==='all'?'selected':''}>Toutes les tournées</option>${TECHS.map(t=>`<option ${tourSelected===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:''}</div><div class="tech-legend">${chosen.map(t=>`<span><i style="background:${TECH_COLORS[t]}"></i>${esc(t)}</span>`).join('')}</div><div id="tour-map" style="height:370px;border-radius:14px;background:#edf4f6"></div><p class="footnote">Trajets affichés dans l'ordre chronologique des interventions. Le tracé routier dépend du service cartographique en ligne. Adresses et positions sont envoyées aux services de cartographie lors du calcul.</p></div>${chosen.map(t=>{let arr=week.filter(i=>i.tech===t).sort((a,b)=>a.start.localeCompare(b.start));let prof=db.technicians.find(x=>x.name===t)||{};let base=(prof.departure==='Bureau'?db.officeAddress:prof.home)||'';let arrival=(prof.arrival==='Bureau'?db.officeAddress:prof.home)||'';return `<div class="card"><h2 style="color:${TECH_COLORS[t]}">${esc(t)}</h2><div class="notice">Départ : ${esc(base||'Adresse à renseigner')} · Retour : ${esc(arrival||'Adresse à renseigner')} · ${arr.length} intervention(s) cette semaine</div>${Array.from({length:5},(_,k)=>{let d=new Date(mon);d.setDate(d.getDate()+k);let day=dateISO(d),items=arr.filter(i=>i.start.slice(0,10)<=day&&(i.end||i.start).slice(0,10)>=day);return `<div class="item"><div class="itembody"><strong>${['Lundi','Mardi','Mercredi','Jeudi','Vendredi'][k]} ${dateFR(day)}</strong><small>${items.length?items.map(i=>esc(i.client)+' · '+esc(i.start.slice(11,16)||'')).join(' / '):'Bureau (aucune visite client planifiée)'}</small></div></div>`}).join('')}</div>`}).join('')}`}
async function geocodeAddress(addr){if(!addr)return null;let cache={};try{cache=JSON.parse(localStorage.getItem('techapp-geocodes')||'{}')}catch{}if(cache[addr])return cache[addr];try{await new Promise(r=>setTimeout(r,1150));let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(addr));let j=await r.json();if(!j.length)return null;let xy=[+j[0].lat,+j[0].lon];cache[addr]=xy;localStorage.setItem('techapp-geocodes',JSON.stringify(cache));return xy}catch{return null}}
async function initTourMap(){let el=document.getElementById('tour-map');if(!el)return;if(typeof L==='undefined'){el.textContent='Carte indisponible sans connexion Internet.';return}if(tourMap){tourMap.remove();tourMap=null}tourMap=L.map(el).setView([46.6,2.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(tourMap);let mon=mondayOf(tourWeek),sun=new Date(mon);sun.setDate(mon.getDate()+6);let techs=role==='admin'?(tourSelected==='all'?TECHS:[tourSelected]):[selectedTech];let all=[];for(let t of techs){if(page!=='tournee')return;let p=db.technicians.find(x=>x.name===t)||{},base=(p.departure==='Bureau'?db.officeAddress:p.home),arrival=(p.arrival==='Bureau'?db.officeAddress:p.home);let jobs=db.interventions.filter(i=>i.tech===t&&i.status==='Planifié'&&i.type!=='Atelier'&&i.start&&i.start.slice(0,10)<=dateISO(sun)&&(i.end||i.start).slice(0,10)>=dateISO(mon)).sort((a,b)=>a.start.localeCompare(b.start));let stops=[];if(base){let xy=await geocodeAddress(base);if(xy)stops.push({xy,label:'Départ / retour · '+t})}for(let job of jobs){let c=db.clients.find(x=>x.name===job.client)||{};let address=[c.address,c.zip,c.city].filter(Boolean).join(', ');let xy=await geocodeAddress(address);if(xy)stops.push({xy,label:job.client+' · '+job.start})}if(stops.length){if(arrival&&stops.length>1){let endXY=arrival===base?stops[0].xy:await geocodeAddress(arrival);if(endXY)stops.push({xy:endXY,label:'Retour · '+t})}stops.forEach((s,k)=>{L.circleMarker(s.xy,{radius:k===0?10:7,color:'#fff',weight:2,fillColor:TECH_COLORS[t],fillOpacity:1}).addTo(tourMap).bindPopup(esc(s.label));all.push(s.xy)});if(stops.length>1){try{let coords=stops.map(s=>s.xy[1]+','+s.xy[0]).join(';');let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson');let j=await r.json();if(j.routes?.[0])L.geoJSON(j.routes[0].geometry,{style:{color:TECH_COLORS[t],weight:4,opacity:.8}}).addTo(tourMap);else L.polyline(stops.map(s=>s.xy),{color:TECH_COLORS[t],dashArray:'5,7'}).addTo(tourMap)}catch{L.polyline(stops.map(s=>s.xy),{color:TECH_COLORS[t],dashArray:'5,7'}).addTo(tourMap)}}}}if(all.length>1)tourMap.fitBounds(all,{padding:[30,30]});else if(all.length===1)tourMap.setView(all[0],10)}

async function addInterventionPhotos(event){let files=[...event.target.files];if(!files.length)return;for(let f of files){if(!f.type.startsWith('image/'))continue;try{let src=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1200/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.68))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(f)});interventionPhotosDraft??=[];interventionPhotosDraft.push(src)}catch(e){alert('Impossible de lire '+f.name)}}let target=document.getElementById('photo-previews');if(target)target.innerHTML=(interventionPhotosDraft||[]).map((src,n)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${n+1}"><button type="button" onclick="removeInterventionPhoto(${n})">×</button></div>`).join('')}
function removeInterventionPhoto(n){if(!interventionPhotosDraft)return;interventionPhotosDraft.splice(n,1);let target=document.getElementById('photo-previews');if(target)target.innerHTML=interventionPhotosDraft.map((src,k)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${k+1}"><button type="button" onclick="removeInterventionPhoto(${k})">×</button></div>`).join('')}
// Test semi-automatique : Outlook crée une invitation depuis le compte de l'utilisateur.
// TechApp ne se connecte pas à Microsoft 365 et n'envoie aucun courriel directement.
function inviteTechnician(id){
 const i=db.interventions.find(x=>x.id===id);
 if(!i)return alert('Intervention introuvable.');
 if(!i.start)return alert('Renseigne une date de début avant de préparer l’invitation.');
 if(!i.tech)return alert('Affecte d’abord un technicien.');
 const profile=db.technicians.find(t=>t.name===i.tech)||{};
 let email=(profile.email||'').trim();
 if(!email){
   email=prompt('Adresse Outlook professionnelle de '+i.tech+' (à renseigner une seule fois) :','')||'';
   email=email.trim();
   if(!email)return;
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert('Adresse email invalide.');
   profile.email=email;
   if(!db.technicians.some(t=>t.name===i.tech))db.technicians.push(profile);
   save();
 }
 const c=db.clients.find(x=>x.name===i.client)||{};
 const location=[c.address,c.zip,c.city].filter(Boolean).join(', ');
 const title=[i.type||'Intervention',i.client||'Client'].join(' - ');
 const body=['Intervention TechApp','Client : '+(i.client||''),'Technicien : '+i.tech,'Type : '+(i.type||''),'Statut : '+(i.status||''),location?'Adresse : '+location:'',i.comment?'Consignes : '+i.comment:''].filter(Boolean).join('\n');
 const start=new Date(i.start.length===10?i.start+'T09:00:00':i.start);
 const endDay=i.end&&i.end>=i.start?i.end:i.start;
 const end=new Date(endDay.length===10?endDay+'T17:00:00':endDay);
 const local=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00';
 const params=new URLSearchParams({path:'/calendar/action/compose',rru:'addevent',subject:title,startdt:local(start),enddt:local(end),body,location,attendees:email});
 const url='https://outlook.office.com/calendar/0/deeplink/compose?'+params.toString();
 // Le support du champ « attendees » varie selon la version d'Outlook.
 // Afficher les instructions avant l'ouverture et permettre la copie de l'adresse.
 const confirmed=confirm('Outlook va ouvrir une nouvelle invitation.\n\nDestinataire : '+email+'\n\nVérifie que le technicien apparaît bien comme invité, puis clique sur Envoyer dans Outlook.\n\nTechApp ne transmet rien automatiquement. Continuer ?');
 if(!confirmed)return;
 const win=window.open(url,'_blank');
 if(!win)window.location.href=url;
}
function modalHTML(){let {type,id}=modal;let source={objective:'objectifs',client:'clients',intervention:'interventions',offer:'offers',stock:'stocks',product:'catalog'}[type];let o=(db[source]||[]).find(x=>x.id===id)||{};let title={objective:'Offre commerciale',client:'Fiche client',intervention:'Intervention',offer:'Demande de maintenance',stock:'Pièce en inventaire',product:'Référence configurateur',settings:'Profil de démonstration'}[type];let body='';if(type==='settings')body=`<div class="notice warning">Le choix du profil simule les permissions dans ce prototype local. Il ne constitue pas une authentification sécurisée.</div>${selectField('role','Mode',['admin','technicien'],role)}${selectField('tech','Technicien',TECHS,selectedTech)}<div class="notice">Les photos des techniciens peuvent être ajoutées depuis un hébergement d’images, via une URL publique.</div>${field('officeAddress','Adresse du bureau',db.officeAddress||'')}${TECHS.filter(t=>role==='admin'||t===selectedTech).map(t=>{let n=TECHS.indexOf(t);return field('home'+n,'Adresse du domicile · '+t,db.technicians[n]?.home||'')+selectField('departure'+n,'Départ · '+t,['Domicile','Bureau'],db.technicians[n]?.departure==='Bureau'?'Bureau':'Domicile')+selectField('arrival'+n,'Retour · '+t,['Domicile','Bureau'],db.technicians[n]?.arrival==='Bureau'?'Bureau':'Domicile')+field('photo'+n,'URL photo · '+t,db.technicians[n]?.photo||'','url')}).join('')}`;

if(type==='client')body=field('name','Nom du client',o.name)+field('number','N° client',o.number)+field('city','Ville',o.city)+field('zip','Code postal',o.zip)+field('address','Adresse',o.address)+field('contact','Contact',o.contact)+field('phone','Téléphone',o.phone,'tel')+field('market','Marché',o.market)+selectField('type','Type client',['End User','OEM','Distributeur','Autre'],o.type||'End User')+field('seller','Code vendeur',o.seller);
if(type==='intervention')body=selectField('client','Client',['',...db.clients.map(c=>c.name)],o.client||'')+selectField('tech','Technicien affecté',['',...TECHS],o.tech||'')+selectField('type','Type',TYPES,o.type||'Installation')+selectField('status','Statut',STATUSES,o.status||'À planifier')+field('start','Date et heure de début',toDateTime(o.start),'datetime-local')+field('end','Date et heure de fin',toDateTime(o.end),'datetime-local')+`<div class="field wide"><small>La durée est calculée automatiquement à partir des deux horaires.</small></div>`+area('comment','Commentaire',o.comment)+`<div class="field wide"><label>Photos de l'intervention (iPhone ou ordinateur)</label><input id="intervention-photos" type="file" accept="image/*" multiple onchange="addInterventionPhotos(event)"><small>Ajoutez plusieurs photos. Les images sont compressées avant stockage local.</small><div id="photo-previews" class="photo-previews">${(o.photos||[]).map((src,n)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${n+1}"><button type="button" onclick="removeInterventionPhoto(${n})">×</button></div>`).join('')}</div></div><div class="notice">Dernière modification : ${o.modified?new Date(o.modified).toLocaleString('fr-FR'):'—'}</div>`;
if(type==='offer')body=selectField('client','Client',['',...db.clients.map(c=>c.name)],o.client||'')+field('distance','Distance bureau/client (km)',o.distance??'','number','min="0"')+field('bacs','Nombre total de bacs',o.bacs||1,'number','min="1"')+area('bacTypes','Types de bacs (ex. B4 x 1, Micron x 2)',o.bacTypes)+`<div class="field wide"><label>Pièces choisies manuellement (une ligne : référence ; désignation ; quantité)</label><textarea name="partsText" placeholder="10100070 ; Filtre cuve B4 ; 2">${esc((o.parts||[]).map(p=>`${p.ref} ; ${p.name} ; ${p.qty}`).join('\n'))}</textarea></div><div class="notice">Forfait par bac : 1er à 100 %, suivants à 60 %. Le prix unitaire est lissé sur tous les bacs. Main-d'œuvre estimative : environ 3 h / bac.</div>`;
if(type==='stock')body=field('number','N° / Référence',o.number)+field('inventory','Inventario',o.inventory||stockOwner)+field('short','Descripción corta',o.short)+area('long','Descripción larga',o.long)+area('english','Descripción en Ingles',o.english)+field('min','Stock mini',o.min||0,'number','min="0"')+field('qty','Quantité actuelle',o.qty??0,'number','min="0"');
if(type==='product')body=selectField('family','Famille',FAMILIES.map(x=>x[0]),o.family||configFamily)+field('name','Désignation',o.name)+field('ref','Référence Navision',o.ref)+area('description','Description / compatibilité',o.description)+field('image','URL image produit (facultatif)',o.image||'','url');
if(type==='intervention'&&interventionPhotosDraft===null)interventionPhotosDraft=[...(o.photos||[])];let readonly=(type==='client'||type==='intervention')&&!canEdit();return `<div class="modalwrap" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>${id?'Modifier / consulter':'Ajouter'} · ${title}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitForm(event,'${type}','${id||''}')"><div class="modalbody"><div class="formgrid">${body}</div></div><div class="modalfoot">${type==='intervention'&&id?`<button type="button" class="btn invite" onclick="inviteTechnician('${id}')">✉ Inviter le technicien</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">Fermer</button>${!readonly?`<button type="submit" class="btn">Enregistrer</button>`:''}</div></form></div></div>`}
function submitForm(event,type,id){event.preventDefault();let fd=new FormData(event.target),v=Object.fromEntries(fd.entries());if(type==='settings'){role=v.role;selectedTech=v.tech;db.officeAddress=v.officeAddress||db.officeAddress||'';TECHS.forEach((name,n)=>{let old=db.technicians[n]||{name};db.technicians[n]={...old,name,photo:v['photo'+n]??old.photo??'',home:v['home'+n]??old.home??'',departure:v['departure'+n]??old.departure??'Domicile',arrival:v['arrival'+n]??old.arrival??'Domicile'}});save();closeModal();return}let collection={objective:'objectifs',client:'clients',intervention:'interventions',offer:'offers',stock:'stocks',product:'catalog'}[type];if(!collection)return;let old=db[collection].find(x=>x.id===id);let obj={...(old||{}),...v,id:id||uid()};if(type==='objective'){obj.amount=Number(v.amount||0);obj.ordered=old?.ordered||false}if(type==='intervention'){obj.photos=[...(interventionPhotosDraft||old?.photos||[])];interventionPhotosDraft=null;if(!v.client)return alert('Sélectionne un client.');if(v.start&&v.end&&v.end<=v.start)return alert('La date de fin doit être postérieure à la date de début.');obj.hours=v.start&&v.end?Math.round((new Date(v.end)-new Date(v.start))/360000)/10:0;obj.zip=db.clients.find(c=>c.name===v.client)?.zip||'';obj.contacted=old?.contacted||false;obj.modified=new Date().toISOString()}if(type==='offer'){obj.distance=Number(v.distance||0);obj.bacs=Math.max(1,Number(v.bacs)||1);obj.parts=(v.partsText||'').split('\n').map(line=>line.split(';').map(s=>s.trim())).filter(x=>x[0]).map(x=>({ref:x[0],name:x[1]||'',qty:Math.max(1,Number(x[2])||1)}));delete obj.partsText}if(type==='stock'){obj.owner=old?.owner||stockOwner;obj.min=Number(v.min||0);obj.qty=Math.max(0,Number(v.qty||0));if(old&&obj.qty!==Number(old.qty||0)){obj.previous=Number(old.qty||0);obj.modified=new Date().toISOString()}}if(old)Object.assign(old,obj);else db[collection].push(obj);save();closeModal()}
function removeItem(collection,id){if(!confirm('Supprimer définitivement cet élément ?'))return;db[collection]=db[collection].filter(x=>x.id!==id);save();render()}
function exportObjectives(){const rows=db.objectifs.map(o=>({'Client':o.client,'N° offre':o.number,'Montant (€)':Number(o.amount),'Type':o.type,'Mois':o.month,'Statut':o.ordered?'Commandée':'Non commandée'}));let n=rows.length,done=db.objectifs.filter(o=>o.ordered),summary=[{'Indicateur':'Total offres','Valeur':n},{'Indicateur':'Montant offres en cours','Valeur':db.objectifs.filter(o=>!o.ordered).reduce((s,o)=>s+Number(o.amount||0),0)},{'Indicateur':'Nombre offres transformées','Valeur':done.length},{'Indicateur':'Montant total commandé','Valeur':done.reduce((s,o)=>s+Number(o.amount||0),0)},{'Indicateur':'Taux transformation (%)','Valeur':n?done.length/n*100:0}];if(typeof XLSX==='undefined'){alert('Le module Excel n’est pas disponible hors connexion. Connectez-vous à Internet pour exporter en .xlsx.');return}let wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Client':'','N° offre':'','Montant (€)':'','Type':'','Mois':'','Statut':''}]),ss=XLSX.utils.json_to_sheet(summary);ws['!cols']=[{wch:28},{wch:20},{wch:16},{wch:16},{wch:14},{wch:19}];ss['!cols']=[{wch:33},{wch:20}];XLSX.utils.book_append_sheet(wb,ws,'Toutes les offres');XLSX.utils.book_append_sheet(wb,ss,'Synthèse');XLSX.writeFile(wb,'TechApp_Objectif.xlsx')}
