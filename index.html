function objective(){let total=db.objectifs.length,done=db.objectifs.filter(o=>o.ordered),ongoing=db.objectifs.filter(o=>!o.ordered).reduce((s,o)=>s+Number(o.amount||0),0),ordered=done.reduce((s,o)=>s+Number(o.amount||0),0);let list=db.objectifs.filter(o=>(o.client+' '+o.number+' '+o.type).toLowerCase().includes(query.toLowerCase())&&(filters.month==='Tous'||o.month===filters.month));return `${hero('Objectif','Suivi de tes offres réalisées, sans cible commerciale imposée.')}<div class="grid">${stat('Total offres',total)}${stat('Montant offres en cours',money(ongoing))}${stat('Offres transformées',done.length)}${stat('Montant commandé',money(ordered))}</div><div class="card" style="margin-top:15px"><strong>Taux de transformation : ${total?(done.length/total*100).toFixed(1).replace('.',','):'0,0'} %</strong></div><div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Offres enregistrées</h2><button class="btn secondary" onclick="exportObjectives()">↓ Export Excel</button><button class="btn" onclick="openForm('objective')">+ Ajouter</button></div><div class="toolbar">${searchBar('Client ou n° offre')}<select style="max-width:190px" onchange="filters.month=this.value;refreshContent()"><option>Tous</option>${MONTHS.map(m=>`<option ${filters.month===m?'selected':''}>${m}</option>`).join('')}</select></div>${list.length?list.map(o=>`<div class="item"><span class="dot ${o.ordered?'green':'red'}"></span><div class="itembody"><strong>${esc(o.client)} / ${esc(o.type)}</strong><small>${esc(o.number)} · ${esc(o.month)} · ${money(o.amount)}</small></div><div class="actions"><button class="btn small ${o.ordered?'secondary':''}" onclick="toggleOrdered('${o.id}')">${o.ordered?'✓ Commandé':'Commandé'}</button><button class="btn secondary small" onclick="openForm('objective','${o.id}')">✎</button><button class="btn danger small" onclick="removeItem('objectifs','${o.id}')">×</button></div></div>`).join(''):`<div class="empty">Aucune offre enregistrée. Ajoute ta première offre pour commencer le suivi.</div>`}</div>`}
function toggleOrdered(id){let o=db.objectifs.find(x=>x.id===id);if(o){o.ordered=!o.ordered;save();render()}}
function clients(){let list=db.clients.filter(c=>Object.values(c).join(' ').toLowerCase().includes(query.toLowerCase()));return `${hero('Clients','Répertoire client.') }<div class="card"><div class="toolbar">${searchBar('Nom, ville, code postal...')}${canEdit()?`<button class="btn" onclick="openForm('client')">+ Ajouter un client</button>`:''}</div>${list.length?list.map(c=>`<div class="item client-click" role="button" tabindex="0" onclick="openForm('client','${c.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openForm('client','${c.id}')}" style="cursor:pointer"><div class="avatar">♙</div><div class="itembody"><strong>${esc(c.name)}</strong><small>${esc(c.zip)} ${esc(c.city)} · ${esc(c.type||'')}</small></div><span aria-hidden="true">›</span></div>`).join(''):`<div class="empty">Aucun client trouvé.</div>`}</div>`}
function techAvatar(name){let t=db.technicians.find(x=>x.name===name);return `<div class="avatar">${t?.photo?`<img src="${esc(t.photo)}" alt="Photo de ${esc(name)}">`:'♙'}</div>`}
function interventions(){
 const archived=i=>['Terminé','Terminée','Non renseigné'].includes(i.status);
 const list=db.interventions.filter(i=>!archived(i)&&filters.types.includes(i.type)&&((i.client||'')+' '+(i.zip||'')+' '+(i.tech||'')+' '+(i.comment||'')).toLowerCase().includes(query.toLowerCase()));
 const groups=['À planifier','Planifié','En attente',...new Set(list.map(i=>i.status).filter(x=>!['À planifier','Planifié','En attente'].includes(x)))];
 return `<div class="card intervention-page"><div class="toolbar">${searchBar('Client, technicien, commentaire...')}${canEdit()?`<button class="btn" onclick="openForm('intervention')">+ Intervention</button>`:''}<button class="btn secondary" onclick="setPage('historique')">Historique</button></div><div class="intervention-summary"><strong>${list.length} interventions actives</strong><span>${list.filter(i=>i.contacted).length} contactées</span><span>${list.filter(i=>!i.contacted).length} à contacter</span></div><div class="typefilters">${TYPES.map(t=>`<button class="pilltoggle" onclick="toggleType('${t}')"><span>${esc(t)}</span><span class="switch ${filters.types.includes(t)?'on':''}"></span></button>`).join('')}</div>${groups.map(status=>{let rows=list.filter(i=>i.status===status);return `<section class="v16-status"><div class="v16-status-head"><strong>${esc(status)}</strong><span>${rows.length}</span></div>${rows.length?rows.map(i=>`<div class="v16-intervention ${i.contacted?'is-contacted':''}">${techAvatar(i.tech)}<div class="v16-intervention-main" onclick="openForm('intervention','${i.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openForm('intervention','${i.id}')"><strong>${esc(i.client||'Intervention sans client')}</strong><div class="v16-meta"><span>${esc(i.tech||'Non affecté')}</span><span>${esc(i.type||'Autre')}</span><span>${i.start?dateFR(i.start):'Date à définir'}</span></div></div><div class="v16-actions"><span class="v16-contact ${i.contacted?'yes':'no'}">${i.contacted?'✓ Contacté':'À contacter'}</span>${(canEdit()||i.tech===selectedTech)?`<button class="btn secondary small" onclick="toggleContact('${i.id}')">${i.contacted?'Annuler contact':'Marquer contacté'}</button>`:''}</div></div>`).join(''):'<div class="v16-empty">Aucune intervention dans ce statut</div>'}</section>`}).join('')}</div>`;
}

let historyTech='Tous',historyType='Tous',historyStatus='Tous';
function historyPage(){let items=db.interventions.filter(i=>['Terminé','Terminée','Non renseigné'].includes(i.status)&& (historyTech==='Tous'||i.tech===historyTech||i.tech==='Tous les techniciens')&&(historyType==='Tous'||i.type===historyType)&&(historyStatus==='Tous'||i.status===historyStatus));return `<div class="card"><div class="toolbar"><button class="btn secondary" onclick="setPage('interventions')">← Interventions</button><h2>Historique (${items.length})</h2></div><div class="toolbar"><select onchange="historyTech=this.value;render()">${['Tous',...TECHS].map(t=>`<option value="${esc(t)}" ${historyTech===t?'selected':''}>${esc(t==='Tous'?'Tous les techniciens':t)}</option>`).join('')}</select><select onchange="historyType=this.value;render()">${['Tous',...TYPES].map(t=>`<option ${historyType===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select onchange="historyStatus=this.value;render()">${['Tous','Terminé','Non renseigné'].map(t=>`<option ${historyStatus===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>${items.map(i=>`<div class="item"><div class="itembody"><strong>${esc(i.client||'Client non renseigné')}</strong><small>${esc(i.tech)} · ${esc(i.type)} · ${esc(i.status)} · ${dateFR(i.start)}</small></div><button class="btn secondary small" onclick="openForm('intervention','${i.id}')">Consulter</button></div>`).join('')||'<div class="empty">Aucune intervention dans cet historique.</div>'}</div>`}
function toggleType(t){filters.types=filters.types.includes(t)?filters.types.filter(x=>x!==t):[...filters.types,t];render()}
function toggleContact(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;if(!canEdit()&&i.tech!==selectedTech)return alert('Cette intervention est affectée à un autre technicien.');i.contacted=!i.contacted;save();render()}
const OFFER_PARTS=[{ref:'10100070',name:'Filtre cuve B4',category:'B4'}];
function startOffer(id){let old=db.offers.find(o=>o.id===id);offerDraft=old?JSON.parse(JSON.stringify(old)):{client:'',distance:'',bacs:1,parts:[]};offerStep=1;offerSearch='';page='offres';render()}
function updateOfferField(k,v){if(offerDraft)offerDraft[k]=v}
function offerNext(){if(offerStep===1){let c=document.getElementById('offer-client'),d=document.getElementById('offer-distance'),n=document.getElementById('offer-bacs');offerDraft.client=c.value;offerDraft.distance=d.value;offerDraft.bacs=Number(n.value);if(!offerDraft.client||d.value===''||Number(d.value)<0||!Number.isInteger(offerDraft.bacs)||offerDraft.bacs<1){alert('Renseigne le client, la distance et le nombre de bacs.');return}}offerStep=Math.min(3,offerStep+1);render()}
function offerBack(){offerStep=Math.max(1,offerStep-1);render()}
function addOfferPart(ref,name){let qty=Number(document.getElementById('partqty-'+ref)?.value||0);if(!Number.isInteger(qty)||qty<1)return alert('Saisis une quantité supérieure à zéro.');let old=offerDraft.parts.find(p=>p.ref===ref);if(old)old.qty+=qty;else offerDraft.parts.push({ref,name,qty});render()}
function removeOfferPart(ref){offerDraft.parts=offerDraft.parts.filter(p=>p.ref!==ref);render()}
function addCustomOfferPart(){let ref=document.getElementById('custom-ref').value.trim(),name=document.getElementById('custom-name').value.trim(),qty=Number(document.getElementById('custom-qty').value);if(!ref||!name||!Number.isInteger(qty)||qty<1)return alert('Indique la référence, la désignation et une quantité valide.');let old=offerDraft.parts.find(p=>p.ref===ref);if(old)old.qty+=qty;else offerDraft.parts.push({ref,name,qty});render()}
function saveOfferDraft(){if(!offerDraft)return;let o={...offerDraft,id:offerDraft.id||uid(),distance:Number(offerDraft.distance),bacs:Number(offerDraft.bacs)};let old=db.offers.find(x=>x.id===o.id);if(old)Object.assign(old,o);else db.offers.push(o);save();offerDraft=null;offerStep=1;render();return o.id}
function sendOfferDraft(){let id=saveOfferDraft();if(id)emailOffer(id)}
function offerWizard(){let stepNames=['Informations','Pièces et quantités','Récapitulatif'];let z=zone(offerDraft.distance),unit=unitPrice(offerDraft.distance,offerDraft.bacs),total=unit*offerDraft.bacs;return `<div class="card"><div class="toolbar"><button class="btn secondary small" onclick="offerDraft=null;render()">← Demandes</button><h2 style="margin:0;flex:1">${offerDraft.id?'Modifier':'Nouvelle'} demande de maintenance</h2></div><div class="wizardsteps">${stepNames.map((x,n)=>`<div class="wizardstep ${offerStep===n+1?'current':''} ${offerStep>n+1?'done':''}"><span>${n+1}</span><strong>${x}</strong></div>`).join('')}</div>${offerStep===1?`<div class="formgrid"><div class="field"><label for="offer-client">Client</label><select id="offer-client"><option value="">Choisir un client</option>${db.clients.map(c=>`<option value="${esc(c.name)}" ${offerDraft.client===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label for="offer-distance">Distance bureau / client (km)</label><input id="offer-distance" type="number" min="0" value="${esc(offerDraft.distance)}"></div><div class="field"><label for="offer-bacs">Nombre total de bacs à entretenir</label><input id="offer-bacs" type="number" min="1" step="1" value="${esc(offerDraft.bacs)}"></div></div><div class="notice">Aucun type de bac à saisir. Tu sélectionnes librement les pièces à l'étape suivante.</div>`:offerStep===2?`<p class="muted">Sélectionne les références et indique les quantités. Tu peux ajouter une référence manuellement si elle n'est pas encore dans le catalogue.</p><div class="toolbar"><input aria-label="Rechercher une pièce" placeholder="Rechercher une pièce ou référence" value="${esc(offerSearch)}" oninput="offerSearch=this.value;document.querySelectorAll('[data-part]').forEach(el=>el.hidden=!el.dataset.part.includes(this.value.toLowerCase()))"></div><div class="partcatalog">${[...OFFER_PARTS,...db.catalog.filter(p=>p.ref&&p.name&&!OFFER_PARTS.some(x=>x.ref===p.ref))].map(p=>`<div class="partrow" data-part="${esc((p.ref+' '+p.name).toLowerCase())}"><div class="part-info"><strong>${esc(p.name)}</strong><small>Réf. ${esc(p.ref)}${p.category?' · '+esc(p.category):''}</small></div><label>Qté <input id="partqty-${esc(p.ref)}" type="number" min="1" step="1" value="1"></label><button class="btn small" onclick="addOfferPart('${esc(p.ref)}','${esc(p.name).replace(/'/g,'&#39;')}')">+ Ajouter</button></div>`).join('')}</div><details class="manualpart"><summary>+ Ajouter une pièce par sa référence</summary><div class="formgrid"><div class="field"><label>Référence</label><input id="custom-ref" placeholder="Référence Navision"></div><div class="field"><label>Désignation</label><input id="custom-name" placeholder="Nom de la pièce"></div><div class="field"><label>Quantité</label><input id="custom-qty" type="number" min="1" value="1"></div></div><button class="btn" onclick="addCustomOfferPart()">Ajouter la pièce</button></details><h3>Pièces sélectionnées (${offerDraft.parts.length})</h3>${offerDraft.parts.length?offerDraft.parts.map(p=>`<div class="item"><div class="itembody"><strong>${esc(p.name)}</strong><small>${esc(p.ref)} · Quantité : ${p.qty}</small></div><button class="btn danger small" onclick="removeOfferPart('${esc(p.ref)}')">Retirer</button></div>`).join(''):'<div class="empty">Aucune pièce sélectionnée.</div>'}`:`<div class="summarygrid"><div><span>Client</span><strong>${esc(offerDraft.client)}</strong></div><div><span>Distance</span><strong>${esc(offerDraft.distance)} km</strong></div><div><span>Zone</span><strong>${z.name}</strong></div><div><span>Nombre de bacs</span><strong>${offerDraft.bacs}</strong></div><div><span>Forfait</span><strong>${z.ref}</strong></div><div><span>Prix unitaire lissé</span><strong>${money(unit)}</strong></div></div><div class="notice">${offerDraft.bacs} × ${money(unit)} = ${money(total)} HT · Main-d'œuvre indicative : environ ${offerDraft.bacs*3} h</div><h3>Pièces à inclure dans l'e-mail</h3>${offerDraft.parts.length?offerDraft.parts.map(p=>`<div class="item"><div class="itembody"><strong>${esc(p.name)}</strong><small>${esc(p.ref)}</small></div><strong>× ${p.qty}</strong></div>`).join(''):'<div class="notice warning">Aucune pièce ajoutée. Vérifie avant d’envoyer.</div>'}<div class="notice">« Envoyer » ouvre ta messagerie avec un e-mail préparé pour Silvia. Aucun envoi automatique.</div>`}<div class="wizardactions">${offerStep>1?`<button class="btn secondary" onclick="offerBack()">← Précédent</button>`:'<button class="btn secondary" onclick="offerDraft=null;render()">Annuler</button>'}<div style="flex:1"></div>${offerStep<3?`<button class="btn" onclick="offerNext()">Suivant →</button>`:`<button class="btn secondary" onclick="saveOfferDraft()">Enregistrer</button><button class="btn" onclick="sendOfferDraft()">✉ Envoyer</button>`}</div></div>`}
function offers(){if(offerDraft)return `${hero('Offres','Demande de maintenance en trois étapes.')}${offerWizard()}`;return `${hero('Offres','Préparer les demandes de contrat de maintenance préventive.') }<div class="card"><div class="toolbar"><h2 style="flex:1;margin:0">Demandes de maintenance</h2><button class="btn" onclick="startOffer()">+ Nouvelle demande</button></div><div class="notice">Parcours : informations client → catalogue de pièces et quantités → résumé et e-mail.</div>${db.offers.length?db.offers.map(o=>`<div class="item"><div class="avatar">✉</div><div class="itembody"><strong>${esc(o.client)}</strong><small>${o.bacs} bac(s) · ${o.distance} km · ${esc(zone(o.distance).name)} · ${money(unitPrice(o.distance,o.bacs))} / bac</small></div><div class="actions"><button class="btn small" onclick="emailOffer('${o.id}')">✉ Mail</button><button class="btn secondary small" onclick="startOffer('${o.id}')">Modifier</button></div></div>`).join(''):'<div class="empty">Aucune demande créée.</div>'}</div>`}
function zone(distance){let d=Number(distance);return d<50?{name:'Zone proche',ref:'80000002',price:414.15}:d<=200?{name:'Zone moyenne',ref:'80000003',price:526.15}:{name:'Zone éloignée',ref:'80000004',price:821.15}}
function unitPrice(d,n){let z=zone(d),qty=Math.max(1,Number(n)||1);return Math.round(z.price*(1+.6*(qty-1))/qty*100)/100}
function emailOffer(id){let o=db.offers.find(x=>x.id===id);if(!o)return;let z=zone(o.distance),parts=(o.parts||[]).map(p=>`${p.qty} x ${p.ref} : ${p.name}`).join('\n');let subject=`Offre Contrat de maintenance préventive : ${o.client}`;let body=`Bonjour Silvia,\n\nPourrais tu établir une offre pour ${o.client} :\n\n"Contrat de maintenance sans engagement :"\n\n${z.name} :\n\n${o.bacs} x ${z.ref} : ${unitPrice(o.distance,o.bacs).toFixed(2).replace('.',',')} € / unité\n\n${parts}\n\nMerci\n\nPour info :\nContrat incluant environ ${Number(o.bacs)*3} heure(s) de m.o\n\nCordialement`;location.href=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}
function stocks(){let owners=['Bureau',...TECHS],list=db.stocks.filter(s=>s.owner===stockOwner&&(s.number+' '+s.short+' '+s.long).toLowerCase().includes(query.toLowerCase()));return `${hero('Matériel','Inventaires indépendants, stock minimum et réapprovisionnement.') }<div class="tabs">${owners.map(o=>`<button class="tab ${stockOwner===o?'active':''}" onclick="stockOwner='${o}';render()">${esc(o)}</button>`).join('')}</div><div class="card"><div class="toolbar">${searchBar('Référence ou désignation')}<button class="btn" onclick="openForm('stock')">+ Ajouter une pièce</button></div>${list.length?list.map(s=>`<div class="item"><div class="avatar">▣</div><div class="itembody"><button type="button" class="stock-ref" onclick="openForm('stock','${s.id}')" title="Modifier cette référence">${esc(s.number)}</button><strong class="stock-desc">${esc(s.short)}</strong><small>Stock : ${Number(s.qty)||0} · Minimum : ${Number(s.min)||0}${s.modified?` · Avant : ${s.previous} · ${new Date(s.modified).toLocaleString('fr-FR')}`:''}</small>${Number(s.qty)<Number(s.min)?'<span class="tag orange">Stock sous le minimum</span>':''}</div><div class="actions"><button class="btn secondary small" onclick="changeQty('${s.id}',-1)">−</button><strong>${Number(s.qty)||0}</strong><button class="btn secondary small" onclick="changeQty('${s.id}',1)">+</button>${Number(s.qty)<Number(s.min)?`<button class="btn small" onclick="reorder('${s.id}')">✉</button>`:''}</div></div>`).join(''):'<div class="empty">Aucune pièce dans cet inventaire.</div>'}</div>`}
function changeQty(id,delta){let s=db.stocks.find(x=>x.id===id);if(!s)return;if(role!=='admin'&&s.owner!==selectedTech)return alert('Inventaire non autorisé.');let next=Math.max(0,Number(s.qty||0)+delta);if(next===Number(s.qty||0))return;s.previous=Number(s.qty||0);s.qty=next;s.modified=new Date().toISOString();save();render()}
function reorder(id){let s=db.stocks.find(x=>x.id===id);if(!s)return;let body=`Bonjour,\n\nPeux-tu prévoir le réapprovisionnement suivant pour l'inventaire ${s.owner} ?\n\n${s.number} - ${s.short}\nQuantité demandée : ${s.min}\nStock actuel : ${s.qty}\n\nMerci.`;location.href=`mailto:?subject=${encodeURIComponent('Réapprovisionnement inventaire '+s.owner)}&body=${encodeURIComponent(body)}`}
let cfg={family:'encolleurs',machine:'Micron+',adhesive:'EVA',pump:'Engrenage',viscosity:5000,consumption:5,capacity:10,voltage:'400 V tri sans neutre',applicators:1,length:3,deposit:'Cordon',sensor:'PT100',valve:'3/2',nozzle:1,angle:0,holes:1};
function cfgSet(k,v){cfg[k]=v;refreshContent()}
function cfgField(k,label,values){return `<div class="v19-field"><label>${esc(label)}</label><select onchange="cfgSet('${k}',this.value)">${values.map(x=>`<option value="${esc(x)}" ${String(cfg[k])===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function cfgNumber(k,label,min,max,step){return `<div class="v19-field"><label>${esc(label)}</label><input type="number" min="${min}" max="${max}" step="${step}" value="${esc(cfg[k])}" onchange="cfgSet('${k}',Number(this.value))"></div>`}
function cfgChecks(){let warnings=[];if(cfg.adhesive==='PUR'&&cfg.pump==='Piston')warnings.push('PUR : pompe à piston non autorisée. Sélectionner une pompe à engrenages.');if(Number(cfg.viscosity)>8000&&cfg.pump==='Piston')warnings.push('Viscosité supérieure à 8 000 mPa·s : pompe à engrenages conseillée.');if(cfg.machine==='B4'&&Number(cfg.applicators)>2)warnings.push('B4 : maximum 2 sorties électriques.');if(Number(cfg.applicators)<1||!Number.isInteger(Number(cfg.applicators)))warnings.push('Le nombre d’applicateurs doit être un entier positif.');if(Number(cfg.length)<=0)warnings.push('La longueur du tuyau doit être positive.');if(Number(cfg.consumption)<=0)warnings.push('La consommation doit être positive.');if(Number(cfg.capacity)<Number(cfg.consumption)*1.2)warnings.push('Capacité insuffisante : prévoir une marge minimale de 20 % par rapport à la consommation horaire estimée.');return warnings}
function cfgSummary(){let diameter=(cfg.adhesive==='PUR'||Number(cfg.viscosity)>20000)?13:8;let warn=cfgChecks();return `<div class="v19-result"><strong>Préconisations calculées</strong><p>Diamètre intérieur du tuyau : <b>Ø ${diameter} mm</b> · Nombre de tuyaux : <b>${esc(cfg.applicators)}</b> (1 par applicateur) · Capacité minimale indicative : <b>${(Number(cfg.consumption)*1.2).toLocaleString('fr-FR')} kg/h</b>.</p><p>${Number(cfg.length)>2.4?'Vérifier la différence de longueur entre circuits : au-delà de 2,4 m, étudier une architecture double pompe / engrenage.':'Vérifier la répartition des circuits et les longueurs réelles.'}</p>${warn.length?`<div class="notice warning"><strong>Points bloquants ou à vérifier</strong><ul>${warn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<div class="notice">Aucune incompatibilité détectée parmi les règles intégrées. Validation technique et références officielles toujours nécessaires.</div>'}</div>`}
function cfgExport(){let warn=cfgChecks();if(warn.some(x=>x.includes('non autorisée')||x.includes('maximum 2')||x.includes('entier positif')||x.includes('doit être positive')))return alert('Corriger les incompatibilités bloquantes avant de sauvegarder.');let entry={...cfg,id:uid(),created:new Date().toISOString(),warnings:warn};db.configurations=db.configurations||[];db.configurations.push(entry);save();alert('Configuration enregistrée localement. Aucune référence Navision n’a été attribuée automatiquement.');refreshContent()}

function configurator(){let f=FAMILIES.find(x=>x[0]===configFamily);if(!configFamily)return `<div class="v19-config-head"><h1>CONFIGURATEUR MELER</h1><p>Choisir, dimensionner et préparer une configuration technique.</p></div><div class="v19-config-grid"><button class="v19-config-card" onclick="configFamily='installation';refreshContent()"><span class="v19-config-icon">▦</span><strong>Installation standard</strong><small>Dimensionnement guidé et contrôles de compatibilité</small></button>${FAMILIES.map(([id,ic,name,sub])=>`<button class="v19-config-card" onclick="configFamily='${id}';refreshContent()"><span class="v19-config-icon">${ic}</span><strong>${name}</strong><small>${sub}</small></button>`).join('')}</div><div class="notice" style="margin-top:18px">Les choix techniques sont opérationnels, mais le catalogue Navision officiel n'est pas fourni : les références restent à renseigner et valider.</div>${(db.configurations||[]).length?`<div class="card" style="margin-top:20px"><h3>Configurations enregistrées (${db.configurations.length})</h3>${db.configurations.slice(-8).reverse().map(x=>`<div class="item"><div class="itembody"><strong>${esc(x.machine)} · ${esc(x.adhesive)}</strong><small>${esc(x.applicators)} applicateur(s) · ${new Date(x.created).toLocaleDateString('fr-FR')}</small></div></div>`).join('')}</div>`:''}`;

function calendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),start=new Date(y,m,1),first=(start.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let entries=db.interventions.filter(i=>['À planifier','Planifié','En attente'].includes(i.status));function events(d){let day=dateISO(d);return entries.filter(i=>i.start&&day>=i.start.slice(0,10)&&day<=(i.end||i.start).slice(0,10))}let monthCells=Array.from({length:Math.ceil((first+days)/7)*7},(_,n)=>{let d=new Date(y,m,n-first+1);return `<div class="calday ${d.getMonth()!==m?'muted':''}"><strong>${d.getDate()}</strong>${events(d).map(i=>`<div class="event" style="--tech-color:${TECH_COLORS[i.tech]||'#85929b'}" title="${esc(i.client)}" onclick="openForm('intervention','${i.id}')">${i.contacted?'✓ ':''}${esc(i.client)}</div>`).join('')}</div>`}).join('');let monday=new Date(calDate);monday.setDate(calDate.getDate()-(calDate.getDay()+6)%7);return `${hero('Calendrier','Vue mensuelle ou planning hebdomadaire par technicien, sans glisser-déposer.') }<div class="card"><div class="tech-legend">${TECHS.map(t=>`<span><i style="background:${TECH_COLORS[t]}"></i>${esc(t)}</span>`).join('')}</div><div class="toolbar"><button class="btn secondary small" onclick="moveCal(-1)">←</button><strong style="flex:1;text-align:center">${calMode==='month'?MONTHS[m]+' '+y:'Semaine '+isoWeekNumber(monday)+' · du '+dateFR(dateISO(monday))}</strong><button class="btn secondary small" onclick="moveCal(1)">→</button><button class="btn secondary small" onclick="calDate=new Date();render()">Aujourd'hui</button><button class="btn ${calMode==='month'?'':'secondary'} small" onclick="calMode='month';render()">Mois</button><button class="btn ${calMode==='week'?'':'secondary'} small" onclick="calMode='week';render()">Semaine</button></div>${calMode==='month'?`<div class="calgrid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div style="text-align:center;font-size:12px;font-weight:700;padding:7px">${x}</div>`).join('')}${monthCells}</div>`:`<div class="weekscroll"><table class="weektable"><tr><th>Technicien</th>${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);return `<th>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][n]} ${d.getDate()}</th>`}).join('')}</tr>${TECHS.map(t=>`<tr><th>${esc(t)}</th>${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);return `<td>${events(d).filter(i=>(i.tech===t||i.tech===ALL_TECH)).map(i=>`<div class="event" style="--tech-color:${TECH_COLORS[i.tech]||'#85929b'}" onclick="openForm('intervention','${i.id}')">${esc(i.client)}</div>`).join('')}</td>`}).join('')}</tr>`).join('')}</table></div><div class="weekmobile">${TECHS.map(t=>`<section class="techweek"><h3 style="color:${TECH_COLORS[t]}">${esc(t)}</h3><div class="weekdays">${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);let es=events(d).filter(i=>(i.tech===t||i.tech===ALL_TECH));return `<div class="weekday"><div class="dayhead">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][n]} <b>${d.getDate()}</b></div><div class="dayevents">${es.length?es.map(i=>`<button class="wevent" style="--tech-color:${TECH_COLORS[i.tech]||'#85929b'}" onclick="openForm('intervention','${i.id}')">${i.contacted?'✓ ':''}${esc(i.client)}</button>`).join(''):'<span class="nodate">—</span>'}</div></div>`}).join('')}</div></section>`).join('')}</div>`}</div>`}
function isoWeekNumber(date){let d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));let y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return String(Math.ceil((((d-y)/86400000)+1)/7)).padStart(2,'0')}

async function initFranceMap(force=false){let el=document.getElementById('france-map');if(!el)return;if(typeof L==='undefined'){el.textContent='Carte indisponible sans connexion Internet.';return}let gen=++mapGeneration;if(franceMap){franceMap.remove();franceMap=null}let map=L.map(el).setView([46.6,2.2],6);franceMap=map;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);let items=mapItems(),groups=new Map(),unlocated=0;for(let i of items){let c=db.clients.find(x=>x.name===i.client);let address=[c?.address,c?.zip,c?.city].filter(Boolean).join(', ');if(!address){unlocated++;continue}if(!groups.has(address))groups.set(address,[]);groups.get(address).push(i)}let points=[],count=0;for(let [address,jobs] of groups){if(gen!==mapGeneration||page!=='carte')return;let pos=await geocodeAddress(address);if(!pos){let j=jobs[0],c=db.clients.find(x=>x.name===j.client)||{};let fallback=[j.zip||c.zip,j.city||c.city,'France'].filter(Boolean).join(', ');if(fallback!=='France')pos=await geocodeAddress(fallback)}if(gen!==mapGeneration||page!=='carte')return;if(!pos){unlocated+=jobs.length;continue}let marker=L.circleMarker(pos,{radius:Math.min(16,8+jobs.length),color:'#fff',weight:2,fillColor:'#159d87',fillOpacity:.9}).addTo(map);let node=document.createElement('div');let heading=document.createElement('strong');heading.textContent=jobs.length+' intervention(s) · '+address;node.append(heading);for(let i of jobs){let row=document.createElement('div');row.style.marginTop='8px';row.textContent=(i.client||'Événement')+' · '+i.tech+' · '+i.status+' ';let b=document.createElement('button');b.textContent='Ouvrir';b.onclick=()=>openForm('intervention',i.id);row.append(b);node.append(row)}marker.bindPopup(node,{maxHeight:260});points.push(pos);count+=jobs.length}if(gen!==mapGeneration)return;if(points.length>1)map.fitBounds(points,{padding:[35,35],maxZoom:9});else if(points.length===1)map.setView(points[0],10);let info=document.getElementById('map-info');if(info)info.textContent=count+' intervention(s) localisée(s) sur '+items.length+' · '+unlocated+' sans position exploitable. Plusieurs interventions à la même adresse sont regroupées dans un repère.'}

let tourMap=null;let tourLayers=[];let tourSelectedTechs=[...TECHS];let tourSelectedTypes=TYPES.filter(t=>t!=='Atelier');let tourSelectedStatuses=STATUSES.filter(s=>!['Terminé','Terminée','Non renseigné'].includes(s));

function mondayOf(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}

function tournee(){let mon=mondayOf(tourWeek),sun=new Date(mon);sun.setDate(mon.getDate()+6);let visible=role==='admin'?TECHS:[selectedTech];if(role!=='admin')tourSelected=selectedTech;let chosen=tourChosen();let week=db.interventions.filter(i=>i.start&&tourMatch(i)&&i.start.slice(0,10)<=dateISO(sun)&&(i.end||i.start).slice(0,10)>=dateISO(mon)&&(chosen.includes(i.tech)||i.tech===ALL_TECH));return `<div class="card"><h2>Tournée · ${dateFR(dateISO(mon))} au ${dateFR(dateISO(sun))}</h2><div class="toolbar"><button class="btn secondary small" onclick="tourMove(-1)">← Semaine</button><button class="btn secondary small" onclick="tourWeek=new Date();render()">Cette semaine</button><button class="btn secondary small" onclick="tourMove(1)">Semaine →</button></div><div class="v18-filter-bar">${role==='admin'?tourMultiFilter('Techniciens','tech',TECHS,tourSelectedTechs):''}${tourMultiFilter('Types','type',TYPES,tourSelectedTypes)}${tourMultiFilter('Statuts','status',STATUSES,tourSelectedStatuses)}</div><div class="toolbar"></div><div class="tech-legend">${chosen.map(t=>`<span><i style="background:${TECH_COLORS[t]}"></i>${esc(t)}</span>`).join('')}</div><div id="tour-map" style="height:370px;border-radius:14px;background:#edf4f6"></div><p class="footnote">Trajets affichés dans l'ordre chronologique des interventions. Le tracé routier dépend du service cartographique en ligne. Adresses et positions sont envoyées aux services de cartographie lors du calcul.</p></div>${chosen.map(t=>{let arr=week.filter(i=>i.tech===t||i.tech===ALL_TECH).sort((a,b)=>a.start.localeCompare(b.start));let pending=db.interventions.filter(i=>(i.tech===t||i.tech===ALL_TECH)&&tourMatch(i)&&!arr.some(x=>x.id===i.id));let prof=db.technicians.find(x=>x.name===t)||{};let base=(prof.departure==='Bureau'?db.officeAddress:prof.home)||'';let arrival=(prof.arrival==='Bureau'?db.officeAddress:prof.home)||'';return `<div class="card"><h2 style="color:${TECH_COLORS[t]}">${esc(t)}</h2><div class="notice">Départ : ${esc(base||'Adresse à renseigner')} · Retour : ${esc(arrival||'Adresse à renseigner')} · ${arr.length} intervention(s) cette semaine</div><details class="v16-pending"><summary>Autres interventions du technicien (${pending.length}) — hors de cette semaine ou sans date</summary><div class="v16-tour-list">${pending.map(i=>`<button class="v16-tour-job" onclick="openForm('intervention','${i.id}')"><b>${esc(i.client||i.comment||'Événement')}</b><span>${esc(i.status)} · ${i.start?dateFR(i.start):'Sans date'} · ${esc(i.type)}</span></button>`).join('')}</div></details>${arr.length?`<div class="v16-tour-list">${arr.map((i,n)=>`<button class="v16-tour-job" onclick="openForm('intervention','${i.id}')"><b>${n+1}. ${esc(i.client||i.comment||'Événement')}</b><span>${esc(i.status)} · ${dateFR(i.start)} · ${esc(i.type)}</span></button>`).join('')}</div>`:'<div class="v16-empty">Aucune intervention datée cette semaine</div>'}${Array.from({length:5},(_,k)=>{let d=new Date(mon);d.setDate(d.getDate()+k);let day=dateISO(d),items=arr.filter(i=>i.start.slice(0,10)<=day&&(i.end||i.start).slice(0,10)>=day);return `<div class="item"><div class="itembody"><strong>${['Lundi','Mardi','Mercredi','Jeudi','Vendredi'][k]} ${dateFR(day)}</strong><small>${items.length?items.map(i=>(arr.indexOf(i)+1)+'. '+esc(i.client)+' · '+esc(i.start.slice(11,16)||'')).join(' / '):'Bureau (aucune visite client planifiée)'}</small></div></div>`}).join('')}</div>`}).join('')}`}
async function geocodeAddress(addr){if(!addr)return null;let cache={};try{cache=JSON.parse(localStorage.getItem('techapp-geocodes')||'{}')}catch{}if(cache[addr])return cache[addr];try{await new Promise(r=>setTimeout(r,1150));let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(addr));let j=await r.json();if(!j.length)return null;let xy=[+j[0].lat,+j[0].lon];cache[addr]=xy;localStorage.setItem('techapp-geocodes',JSON.stringify(cache));return xy}catch{return null}}
async function initTourMap(){
 let el=document.getElementById('tour-map');if(!el)return;
 if(typeof L==='undefined'){el.textContent='Carte indisponible sans connexion Internet.';return}
 if(tourMap){tourMap.remove();tourMap=null}
 tourMap=L.map(el).setView([46.6,2.2],6);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(tourMap);
 let mon=mondayOf(tourWeek),sun=new Date(mon);sun.setDate(mon.getDate()+6);
 let techs=tourChosen(),all=[];
 for(let t of techs){
  if(page!=='tournee')return;
  let p=db.technicians.find(x=>x.name===t)||{},base=(p.departure==='Bureau'?db.officeAddress:p.home),arrival=(p.arrival==='Bureau'?db.officeAddress:p.home);
  let jobs=db.interventions.filter(i=>(i.tech===t||i.tech===ALL_TECH)&&tourMatch(i)&&i.start&&i.start.slice(0,10)<=dateISO(sun)&&(i.end||i.start).slice(0,10)>=dateISO(mon)).sort((a,b)=>a.start.localeCompare(b.start));
  let stops=[];
  if(base){let xy=await geocodeAddress(base);if(xy)stops.push({xy,label:'Départ · '+t,kind:'start',address:base})}
  let visitNumber=0;
  for(let job of jobs){
   if(page!=='tournee')return;
   let c=db.clients.find(x=>x.name===job.client)||{},address=[c.address,c.zip,c.city].filter(Boolean).join(', ');
   let xy=await geocodeAddress(address);
   if(!xy){let fallback=[job.zip||c.zip,job.city||c.city,'France'].filter(Boolean).join(', ');if(fallback!=='France')xy=await geocodeAddress(fallback)}
   if(xy)stops.push({xy,label:job.client,kind:'visit',number:++visitNumber,address,time:job.start});
  }
  if(arrival&&stops.length){let endXY=arrival===base&&stops[0]?.kind==='start'?stops[0].xy:await geocodeAddress(arrival);if(endXY)stops.push({xy:endXY,label:'Retour · '+t,kind:'end',address:arrival})}
  if(!stops.length)continue;
  // Tracé placé avant les repères, pour que les numéros restent visibles.
  if(stops.length>1){try{
   let coords=stops.map(s=>s.xy[1]+','+s.xy[0]).join(';');
   let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson');let j=await r.json();
   if(j.routes?.[0])L.geoJSON(j.routes[0].geometry,{style:{color:TECH_COLORS[t],weight:4,opacity:.8}}).addTo(tourMap);
   else L.polyline(stops.map(s=>s.xy),{color:TECH_COLORS[t],dashArray:'5,7'}).addTo(tourMap);
  }catch{L.polyline(stops.map(s=>s.xy),{color:TECH_COLORS[t],dashArray:'5,7'}).addTo(tourMap)}}
  stops.forEach(stop=>{
   let symbol=stop.kind==='start'?'⌂':stop.kind==='end'?'✓':String(stop.number);
   let pin=L.divIcon({className:'tour-number-pin',html:'<div class="tour-pin '+(stop.kind==='visit'?'':'tour-pin-base')+'" style="background:'+TECH_COLORS[t]+'">'+symbol+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
   let popup=document.createElement('div');let title=document.createElement('strong');title.textContent=(stop.kind==='visit'?'Visite '+stop.number+' · ':'')+stop.label;
   popup.appendChild(title);
   if(stop.time){let time=document.createElement('div');time.textContent='Horaire : '+stop.time.replace('T',' ');popup.appendChild(time)}
   if(stop.address){let addr=document.createElement('div');addr.textContent=stop.address;popup.appendChild(addr)}
   L.marker([stop.xy[0]+(stop.number||0)*0.00012,stop.xy[1]+(stop.number||0)*0.00012],{icon:pin,zIndexOffset:1000}).addTo(tourMap).bindPopup(popup);all.push(stop.xy);
  });
 }
 if(all.length>1)tourMap.fitBounds(all,{padding:[30,30]});else if(all.length===1)tourMap.setView(all[0],10);
}

async function addInterventionPhotos(event){let files=[...event.target.files];if(!files.length)return;for(let f of files){if(!f.type.startsWith('image/'))continue;try{let src=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1200/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.68))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(f)});interventionPhotosDraft??=[];interventionPhotosDraft.push(src)}catch(e){alert('Impossible de lire '+f.name)}}let target=document.getElementById('photo-previews');if(target)target.innerHTML=(interventionPhotosDraft||[]).map((src,n)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${n+1}"><button type="button" onclick="removeInterventionPhoto(${n})">×</button></div>`).join('')}
function removeInterventionPhoto(n){if(!interventionPhotosDraft)return;interventionPhotosDraft.splice(n,1);let target=document.getElementById('photo-previews');if(target)target.innerHTML=interventionPhotosDraft.map((src,k)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${k+1}"><button type="button" onclick="removeInterventionPhoto(${k})">×</button></div>`).join('')}
// Test semi-automatique : Outlook crée une invitation depuis le compte de l'utilisateur.
// TechApp ne se connecte pas à Microsoft 365 et n'envoie aucun courriel directement.
function inviteTechnician(id){
 const i=db.interventions.find(x=>x.id===id);
 if(!i)return alert('Intervention introuvable.');
 if(!i.start)return alert('Renseigne une date de début avant de préparer l’invitation.');
 if(!i.tech)return alert('Affecte d’abord un technicien.');
 
 const profile=db.technicians.find(t=>t.name===i.tech)||{name:i.tech};
 let email=i.tech===ALL_TECH?TECHS.map(t=>db.technicians.find(p=>p.name===t)?.email||'').filter(Boolean).join(';'):(profile.email||'').trim();
 if(!email){
   email=prompt(i.tech===ALL_TECH?'Adresses professionnelles des quatre techniciens, séparées par des points-virgules :':'Adresse Outlook professionnelle de '+i.tech+' (à renseigner une seule fois) :','')||'';
   email=email.trim();
   if(!email)return;
   if(!email.split(';').every(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.trim())))return alert('Adresse email invalide.');
   if(i.tech!==ALL_TECH)profile.email=email;
   if(i.tech!==ALL_TECH&&!db.technicians.some(t=>t.name===i.tech))db.technicians.push(profile);
   save();
 }
 const c=db.clients.find(x=>x.name===i.client)||{};
 const location=[c.address,c.zip,c.city].filter(Boolean).join(', ');
 const title=[i.type||'Intervention',i.client||'Client'].join(' - ');
 const body=['Intervention TechApp','Client : '+(i.client||''),'Technicien : '+i.tech,'Type : '+(i.type||''),'Statut : '+(i.status||''),location?'Adresse : '+location:'',i.comment?'Consignes : '+i.comment:''].filter(Boolean).join('\n');
 const start=new Date(i.start.length===10?i.start+'T09:00:00':i.start);
 const endDay=i.end&&i.end>=i.start?i.end:i.start;
 const end=new Date(endDay.length===10?endDay+'T17:00:00':endDay);
 const local=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00';
 const params=new URLSearchParams({path:'/calendar/action/compose',rru:'addevent',subject:title,startdt:local(start),enddt:local(end),body,location,attendees:email.replaceAll(';',',')});
 const url='https://outlook.office.com/calendar/0/deeplink/compose?'+params.toString();
 // Outlook doit réellement envoyer l'invitation depuis le compte connecté : ce lien seul ne l'envoie pas.
 // Afficher les instructions avant l'ouverture et permettre la copie de l'adresse.
 const confirmed=confirm('Outlook va ouvrir une nouvelle invitation.\nATTENTION : si le destinataire n’apparaît pas dans le champ Invités, ajoute-le manuellement.\n\n\nDestinataire : '+email+'\n\nVérifie que le technicien apparaît bien comme invité, puis clique sur Envoyer dans Outlook.\n\nTechApp ne transmet rien automatiquement. Continuer ?');
 if(!confirmed)return;
 const win=window.open(url,'_blank');
 if(!win)window.location.href=url;
}
function modalHTML(){let {type,id}=modal;let source={objective:'objectifs',client:'clients',intervention:'interventions',offer:'offers',stock:'stocks',product:'catalog'}[type];let o=(db[source]||[]).find(x=>x.id===id)||{};let title={objective:'Offre commerciale',client:'Fiche client',intervention:'Intervention',offer:'Demande de maintenance',stock:'Pièce en inventaire',product:'Référence configurateur',settings:'Profil de démonstration'}[type];let body='';if(type==='settings')body=`<div class="notice warning">Le choix du profil simule les permissions dans ce prototype local. Il ne constitue pas une authentification sécurisée.</div>${selectField('role','Mode',['admin','technicien'],role)}${selectField('tech','Technicien',TECHS,selectedTech)}<div class="notice">Les photos des techniciens peuvent être ajoutées depuis un hébergement d’images, via une URL publique.</div>${field('officeAddress','Adresse du bureau',db.officeAddress||'')}${TECHS.filter(t=>role==='admin'||t===selectedTech).map(t=>{let n=TECHS.indexOf(t);return field('home'+n,'Adresse du domicile · '+t,db.technicians[n]?.home||'')+selectField('departure'+n,'Départ · '+t,['Domicile','Bureau'],db.technicians[n]?.departure==='Bureau'?'Bureau':'Domicile')+selectField('arrival'+n,'Retour · '+t,['Domicile','Bureau'],db.technicians[n]?.arrival==='Bureau'?'Bureau':'Domicile')+field('photo'+n,'URL photo · '+t,db.technicians[n]?.photo||'','url')}).join('')}`;

if(type==='client')body=field('name','Nom du client',o.name)+field('number','N° client',o.number)+field('city','Ville',o.city)+field('zip','Code postal',o.zip)+field('address','Adresse',o.address)+field('contact','Contact',o.contact)+field('phone','Téléphone',o.phone,'tel')+field('market','Marché',o.market)+selectField('type','Type client',['End User','OEM','Distributeur','Autre'],o.type||'End User')+field('seller','Code vendeur',o.seller);
if(type==='intervention')body=selectField('client','Client',['',...db.clients.map(c=>c.name)],o.client||'')+selectField('tech','Technicien affecté',['',...TECHS,ALL_TECH],o.tech||'')+selectField('type','Type',TYPES,o.type||'Installation')+selectField('status','Statut',STATUSES,o.status||'À planifier')+field('start','Date et heure de début',toDateTime(o.start),'datetime-local')+field('end','Date et heure de fin',toDateTime(o.end),'datetime-local')+`<div class="field wide"><small>La durée est calculée automatiquement à partir des deux horaires.</small></div>`+area('comment','Commentaire',o.comment)+`<div class="field wide"><label>Photos de l'intervention (iPhone ou ordinateur)</label><input id="intervention-photos" type="file" accept="image/*" multiple onchange="addInterventionPhotos(event)"><small>Ajoutez plusieurs photos. Les images sont compressées avant stockage local.</small><div id="photo-previews" class="photo-previews">${(o.photos||[]).map((src,n)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${n+1}"><button type="button" onclick="removeInterventionPhoto(${n})">×</button></div>`).join('')}</div></div><div class="notice">Dernière modification : ${o.modified?new Date(o.modified).toLocaleString('fr-FR'):'—'}</div>`;
if(type==='offer')body=selectField('client','Client',['',...db.clients.map(c=>c.name)],o.client||'')+field('distance','Distance bureau/client (km)',o.distance??'','number','min="0"')+field('bacs','Nombre total de bacs',o.bacs||1,'number','min="1"')+area('bacTypes','Types de bacs (ex. B4 x 1, Micron x 2)',o.bacTypes)+`<div class="field wide"><label>Pièces choisies manuellement (une ligne : référence ; désignation ; quantité)</label><textarea name="partsText" placeholder="10100070 ; Filtre cuve B4 ; 2">${esc((o.parts||[]).map(p=>`${p.ref} ; ${p.name} ; ${p.qty}`).join('\n'))}</textarea></div><div class="notice">Forfait par bac : 1er à 100 %, suivants à 60 %. Le prix unitaire est lissé sur tous les bacs. Main-d'œuvre estimative : environ 3 h / bac.</div>`;
if(type==='stock')body=field('number','N° / Référence',o.number)+field('inventory','Inventario',o.inventory||stockOwner)+field('short','Descripción corta',o.short)+area('long','Descripción larga',o.long)+area('english','Descripción en Ingles',o.english)+field('min','Stock mini',o.min||0,'number','min="0"')+field('qty','Quantité actuelle',o.qty??0,'number','min="0"');
if(type==='product')body=selectField('family','Famille',FAMILIES.map(x=>x[0]),o.family||configFamily)+field('name','Désignation',o.name)+field('ref','Référence Navision',o.ref)+area('description','Description / compatibilité',o.description)+field('image','URL image produit (facultatif)',o.image||'','url');
if(type==='intervention'&&interventionPhotosDraft===null)interventionPhotosDraft=[...(o.photos||[])];let readonly=(type==='client'||type==='intervention')&&!canEdit();return `<div class="modalwrap" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>${id?'Modifier / consulter':'Ajouter'} · ${title}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitForm(event,'${type}','${id||''}')"><div class="modalbody"><div class="formgrid">${body}</div></div><div class="modalfoot">${type==='intervention'&&id?`<button type="button" class="btn invite" onclick="inviteTechnician('${id}')">✉ Inviter le technicien</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">Fermer</button>${!readonly?`<button type="submit" class="btn">Enregistrer</button>`:''}</div></form></div></div>`}
function submitForm(event,type,id){event.preventDefault();let fd=new FormData(event.target),v=Object.fromEntries(fd.entries());if(type==='settings'){role=v.role;selectedTech=v.tech;db.officeAddress=v.officeAddress||db.officeAddress||'';TECHS.forEach((name,n)=>{let old=db.technicians[n]||{name};db.technicians[n]={...old,name,photo:v['photo'+n]??old.photo??'',home:v['home'+n]??old.home??'',departure:v['departure'+n]??old.departure??'Domicile',arrival:v['arrival'+n]??old.arrival??'Domicile'}});save();closeModal();return}let collection={objective:'objectifs',client:'clients',intervention:'interventions',offer:'offers',stock:'stocks',product:'catalog'}[type];if(!collection)return;let old=db[collection].find(x=>x.id===id);let obj={...(old||{}),...v,id:id||uid()};if(type==='objective'){obj.amount=Number(v.amount||0);obj.ordered=old?.ordered||false}if(type==='intervention'){obj.photos=[...(interventionPhotosDraft||old?.photos||[])];interventionPhotosDraft=null;if(!v.client&&v.tech!==ALL_TECH)return alert('Sélectionne un client.');if(v.start&&v.end&&v.end<=v.start)return alert('La date de fin doit être postérieure à la date de début.');obj.hours=v.start&&v.end?Math.round((new Date(v.end)-new Date(v.start))/360000)/10:0;obj.zip=db.clients.find(c=>c.name===v.client)?.zip||'';obj.contacted=old?.contacted||false;obj.modified=new Date().toISOString()}if(type==='offer'){obj.distance=Number(v.distance||0);obj.bacs=Math.max(1,Number(v.bacs)||1);obj.parts=(v.partsText||'').split('\n').map(line=>line.split(';').map(s=>s.trim())).filter(x=>x[0]).map(x=>({ref:x[0],name:x[1]||'',qty:Math.max(1,Number(x[2])||1)}));delete obj.partsText}if(type==='stock'){obj.owner=old?.owner||stockOwner;obj.min=Number(v.min||0);obj.qty=Math.max(0,Number(v.qty||0));if(old&&obj.qty!==Number(old.qty||0)){obj.previous=Number(old.qty||0);obj.modified=new Date().toISOString()}}if(old)Object.assign(old,obj);else db[collection].push(obj);save();closeModal()}
function removeItem(collection,id){if(!confirm('Supprimer définitivement cet élément ?'))return;db[collection]=db[collection].filter(x=>x.id!==id);save();render()}
