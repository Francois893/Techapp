function setPage(p){page=p;query='';modal=null;mobileMenu=false;render()}
function navHtml(){return NAV.map(([id,ic,label])=>`<button class="navbtn ${page===id?'active':''}" onclick="setPage('${id}')"><span class="ico">${ic}</span><span class="navlabel">${label}</span></button>`).join('')}
function render(){document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="icon-180.png" alt="" style="width:35px;height:35px;vertical-align:middle;border-radius:8px;margin-right:8px">MELER <b>∿</b><small>TECHAPP · SERVICE TECHNIQUE</small></div>${navHtml()}<div class="sidefoot">Version locale · prête pour GitHub Pages</div></aside><main class="main"><header class="top"><div><div style="font-weight:900;font-size:18px">${NAV.find(n=>n[0]===page)?.[2]||'TechApp'}</div><div class="subtitle">MELER · Gestion technique</div></div><div class="topright"><span class="chip">● Interface locale</span><button class="btn secondary small" onclick="openSettings()">⚙ Profil</button><button class="btn secondary small menuMobile" onclick="mobileMenu=!mobileMenu;render()">☰</button></div></header><div class="content">${screen()}</div></main><nav class="bottomnav">${NAV.filter(n=>BOTTOM.includes(n[0])).map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="setPage('${id}')"><span class="ico">${ic}</span>${label}</button>`).join('')}</nav></div>${mobileMenu?`<div class="modalwrap" onclick="mobileMenu=false;render()"><div class="modal" onclick="event.stopPropagation()"><div class="modalbody">${NAV.map(([id,ic,label])=>`<button class="navbtn" style="color:#123" onclick="setPage('${id}')">${ic} ${label}</button>`).join('')}</div></div></div>`:''}${modal?modalHTML():''}`;if(page==='carte')setTimeout(()=>initFranceMap(),0)}
function hero(title,desc){return `<div class="hero"><small>MELER / TECHAPP</small><h1>${title}</h1><p>${desc}</p></div>`}
function stat(label,value){return `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`}
function searchBar(placeholder='Rechercher...'){return `<input aria-label="Rechercher" placeholder="⌕  ${placeholder}" value="${esc(query)}" oninput="query=this.value;refreshContent()">`}
function refreshContent(){let el=document.querySelector('.content');if(el)el.innerHTML=screen()}
function canEdit(){return role==='admin'}
function screen(){switch(page){case'accueil':return home();case'objectif':return objective();case'clients':return clients();case'interventions':return interventions();case'offres':return offers();case'materiel':return stocks();case'configurateur':return configurator();case'calendrier':return calendar();case'carte':return mapPage();default:return home()}}
function home(){const mobileHome=`<div class="home-screen"><div class="home-hero"><img src="icon-180.png" alt="TechApp"><h1>MELER <span style="color:#32c9d2">∿</span></h1><div style="font-size:11px;font-weight:700;letter-spacing:1.4px">SERVICE TECHNIQUE</div><p>Votre outil terrain<br>pour un service performant</p></div><div class="home-tiles">${[['objectif','◎','Objectif'],['clients','♧','Clients'],['interventions','⚒','Interventions'],['offres','▤','Offres'],['materiel','⬡','Matériel'],['calendrier','▦','Calendrier']].map(([id,ic,label])=>`<button onclick="setPage('${id}')"><span class="tileicon">${ic}</span>${label}</button>`).join('')}</div><div class="home-extras"><button onclick="setPage('carte')">⌖ Carte des interventions</button><button onclick="setPage('configurateur')">⚙ Configurateur</button></div></div>`;let pending=db.interventions.filter(i=>i.status==='À planifier').length;let planned=db.interventions.filter(i=>i.status==='Planifié').length;return `${mobileHome}<div class="desktop-home">${hero('TECHAPP · SERVICE TECHNIQUE','Pilotez vos interventions, vos clients et vos équipements depuis un seul espace.') }<div class="homewelcome"><img src="icon-180.png" alt="TechApp"><div><strong>Votre espace technique Meler</strong><span>Accès rapide aux outils métier · iPhone et ordinateur</span></div></div><div class="grid">${[['objectif','◎','Objectif','Suivi commercial'],['clients','♙','Clients','Annuaire et contacts'],['interventions','🔧','Interventions','Planification'],['offres','▤','Offres','Maintenance préventive'],['materiel','▣','Matériel','Inventaires'],['configurateur','⚙','Configurateur','Sélection de produits'],['calendrier','▦','Calendrier','Planning équipe'],['carte','⌖','Carte de France','Interventions à localiser']].map(([id,ic,title,sub])=>`<button class="category" onclick="setPage('${id}')"><span class="symbol">${ic}</span><strong>${title}</strong><small>${sub}</small></button>`).join('')}</div><h2 class="sectiontitle">Vue d'ensemble</h2><div class="grid">${stat('À planifier',pending)}${stat('Planifiées',planned)}${stat('Clients',db.clients.length)}${stat('Offres enregistrées',db.objectifs.length)}</div><div class="notice">Les données saisies sont enregistrées uniquement dans ce navigateur. L'hébergement GitHub Pages ne fournit pas de base de données partagée ni de connexion sécurisée.</div></div>`}
function objective(){let total=db.objectifs.length,done=db.objectifs.filter(o=>o.ordered),ongoing=db.objectifs.filter(o=>!o.ordered).reduce((s,o)=>s+Number(o.amount||0),0),ordered=done.reduce((s,o)=>s+Number(o.amount||0),0);let list=db.objectifs.filter(o=>(o.client+' '+o.number+' '+o.type).toLowerCase().includes(query.toLowerCase())&&(filters.month==='Tous'||o.month===filters.month));return `${hero('Objectif','Suivi de tes offres réalisées, sans cible commerciale imposée.')}<div class="grid">${stat('Total offres',total)}${stat('Montant offres en cours',money(ongoing))}${stat('Offres transformées',done.length)}${stat('Montant commandé',money(ordered))}</div><div class="card" style="margin-top:15px"><strong>Taux de transformation : ${total?(done.length/total*100).toFixed(1).replace('.',','):'0,0'} %</strong></div><div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Offres enregistrées</h2><button class="btn secondary" onclick="exportObjectives()">↓ Export Excel</button><button class="btn" onclick="openForm('objective')">+ Ajouter</button></div><div class="toolbar">${searchBar('Client ou n° offre')}<select style="max-width:190px" onchange="filters.month=this.value;refreshContent()"><option>Tous</option>${MONTHS.map(m=>`<option ${filters.month===m?'selected':''}>${m}</option>`).join('')}</select></div>${list.length?list.map(o=>`<div class="item"><span class="dot ${o.ordered?'green':'red'}"></span><div class="itembody"><strong>${esc(o.client)} / ${esc(o.type)}</strong><small>${esc(o.number)} · ${esc(o.month)} · ${money(o.amount)}</small></div><div class="actions"><button class="btn small ${o.ordered?'secondary':''}" onclick="toggleOrdered('${o.id}')">${o.ordered?'✓ Commandé':'Commandé'}</button><button class="btn secondary small" onclick="openForm('objective','${o.id}')">✎</button><button class="btn danger small" onclick="removeItem('objectifs','${o.id}')">×</button></div></div>`).join(''):`<div class="empty">Aucune offre enregistrée. Ajoute ta première offre pour commencer le suivi.</div>`}</div>`}
function toggleOrdered(id){let o=db.objectifs.find(x=>x.id===id);if(o){o.ordered=!o.ordered;save();render()}}
function clients(){let list=db.clients.filter(c=>Object.values(c).join(' ').toLowerCase().includes(query.toLowerCase()));return `${hero('Clients','Répertoire client partagé et informations utiles pour les interventions.') }<div class="card"><div class="toolbar">${searchBar('Nom, ville, code postal...')}${canEdit()?`<button class="btn" onclick="openForm('client')">+ Ajouter un client</button>`:''}</div>${list.length?list.map(c=>`<div class="item"><div class="avatar">♙</div><div class="itembody"><strong>${esc(c.name)}</strong><small>${esc(c.zip)} ${esc(c.city)} · ${esc(c.type||'')}</small></div><button class="btn secondary small" onclick="openForm('client','${c.id}')">Voir ${canEdit()?' / modifier':''}</button></div>`).join(''):`<div class="empty">Aucun client. Les clients créés apparaîtront ici.</div>`}</div>`}
function techAvatar(name){let t=db.technicians.find(x=>x.name===name);return `<div class="avatar">${t?.photo?`<img src="${esc(t.photo)}" alt="Photo de ${esc(name)}">`:'♙'}</div>`}
function interventions(){let list=db.interventions.filter(i=>filters.types.includes(i.type)&&(i.client+' '+i.zip+' '+i.tech+' '+i.comment).toLowerCase().includes(query.toLowerCase()));return `${hero('Interventions','Organisation des installations, assistances, audits et travaux atelier.') }<div class="card"><div class="toolbar">${searchBar('Client, technicien, commentaire...')}${canEdit()?`<button class="btn" onclick="openForm('intervention')">+ Intervention</button>`:''}</div><div class="typefilters">${TYPES.map(t=>`<button class="pilltoggle" onclick="toggleType('${t}')"><span class="type-label">${t}</span><span class="switch ${filters.types.includes(t)?'on':''}"></span></button>`).join('')}</div>${TYPES.filter(t=>filters.types.includes(t)).map(t=>`<h2 class="sectiontitle">${t}</h2>${STATUSES.map(s=>{let rows=list.filter(i=>i.type===t&&i.status===s);return rows.length?`<div style="margin:15px 0"><strong style="font-size:13px;color:#506674">${s} (${rows.length})</strong>${rows.map(i=>`<div class="item">${techAvatar(i.tech)}<div class="itembody"><strong>${esc(i.client||'Client non renseigné')} / ${esc(i.zip||'')}</strong><small><span class="dot ${i.contacted?'green':''}"></span>${esc(s)}${i.start?' · '+dateFR(i.start):''} ${i.tech?' · '+esc(i.tech):''}</small></div><div class="actions">${(canEdit()||i.tech===selectedTech)?`<button class="btn small secondary" onclick="toggleContact('${i.id}')">${i.contacted?'✓ Contacté':'Contacter'}</button>`:''}<button class="btn secondary small" onclick="openForm('intervention','${i.id}')">Détails</button></div></div>`).join('')}</div>`:''}).join('')}${!list.some(i=>i.type===t)?`<div class="empty">Aucune intervention dans cette catégorie</div>`:''}`).join('')}${filters.types.length===0?'<div class="empty">Active au moins un type d’intervention.</div>':''}</div>`}
function toggleType(t){filters.types=filters.types.includes(t)?filters.types.filter(x=>x!==t):[...filters.types,t];render()}
function toggleContact(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;if(!canEdit()&&i.tech!==selectedTech)return alert('Cette intervention est affectée à un autre technicien.');i.contacted=!i.contacted;save();render()}
const OFFER_PARTS=[{ref:'10100070',name:'Filtre cuve B4',category:'B4'}];
function startOffer(id){let old=db.offers.find(o=>o.id===id);offerDraft=old?JSON.parse(JSON.stringify(old)):{client:'',distance:'',bacs:1,parts:[]};offerStep=1;offerSearch='';page='offres';render()}
function updateOfferField(k,v){if(offerDraft)offerDraft[k]=v}
function offerNext(){if(offerStep===1){let c=document.getElementById('offer-client'),d=document.getElementById('offer-distance'),n=document.getElementById('offer-bacs');offerDraft.client=c.value;offerDraft.distance=d.value;offerDraft.bacs=Number(n.value);if(!offerDraft.client||d.value===''||Number(d.value)<0||!Number.isInteger(offerDraft.bacs)||offerDraft.bacs<1){alert('Renseigne le client, la distance et le nombre de bacs.');return}}offerStep=Math.min(3,offerStep+1);render()}
function offerBack(){offerStep=Math.max(1,offerStep-1);render()}
function addOfferPart(ref,name){let qty=Number(document.getElementById('partqty-'+ref)?.value||0);if(!Number.isInteger(qty)||qty<1)return alert('Saisis une quantité supérieure à zéro.');let old=offerDraft.parts.find(p=>p.ref===ref);if(old)old.qty+=qty;else offerDraft.parts.push({ref,name,qty});render()}
function removeOfferPart(ref){offerDraft.parts=offerDraft.parts.filter(p=>p.ref!==ref);render()}
function addCustomOfferPart(){let ref=document.getElementById('custom-ref').value.trim(),name=document.getElementById('custom-name').value.trim(),qty=Number(document.getElementById('custom-qty').value);if(!ref||!name||!Number.isInteger(qty)||qty<1)return alert('Indique la référence, la désignation et une quantité valide.');let old=offerDraft.parts.find(p=>p.ref===ref);if(old)old.qty+=qty;else offerDraft.parts.push({ref,name,qty});render()}
function saveOfferDraft(){if(!offerDraft)return;let o={...offerDraft,id:offerDraft.id||uid(),distance:Number(offerDraft.distance),bacs:Number(offerDraft.bacs)};let old=db.offers.find(x=>x.id===o.id);if(old)Object.assign(old,o);else db.offers.push(o);save();offerDraft=null;offerStep=1;render();return o.id}
function sendOfferDraft(){let id=saveOfferDraft();if(id)emailOffer(id)}
function offerWizard(){let stepNames=['Informations','Pièces et quantités','Récapitulatif'];let z=zone(offerDraft.distance),unit=unitPrice(offerDraft.distance,offerDraft.bacs),total=unit*offerDraft.bacs;return `<div class="card"><div class="toolbar"><button class="btn secondary small" onclick="offerDraft=null;render()">← Demandes</button><h2 style="margin:0;flex:1">${offerDraft.id?'Modifier':'Nouvelle'} demande de maintenance</h2></div><div class="wizardsteps">${stepNames.map((x,n)=>`<div class="wizardstep ${offerStep===n+1?'current':''} ${offerStep>n+1?'done':''}"><span>${n+1}</span><strong>${x}</strong></div>`).join('')}</div>${offerStep===1?`<div class="formgrid"><div class="field"><label for="offer-client">Client</label><select id="offer-client"><option value="">Choisir un client</option>${db.clients.map(c=>`<option value="${esc(c.name)}" ${offerDraft.client===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label for="offer-distance">Distance bureau / client (km)</label><input id="offer-distance" type="number" min="0" value="${esc(offerDraft.distance)}"></div><div class="field"><label for="offer-bacs">Nombre total de bacs à entretenir</label><input id="offer-bacs" type="number" min="1" step="1" value="${esc(offerDraft.bacs)}"></div></div><div class="notice">Aucun type de bac à saisir. Tu sélectionnes librement les pièces à l'étape suivante.</div>`:offerStep===2?`<p class="muted">Sélectionne les références et indique les quantités. Tu peux ajouter une référence manuellement si elle n'est pas encore dans le catalogue.</p><div class="toolbar"><input aria-label="Rechercher une pièce" placeholder="Rechercher une pièce ou référence" value="${esc(offerSearch)}" oninput="offerSearch=this.value;document.querySelectorAll('[data-part]').forEach(el=>el.hidden=!el.dataset.part.includes(this.value.toLowerCase()))"></div><div class="partcatalog">${[...OFFER_PARTS,...db.catalog.filter(p=>p.ref&&p.name&&!OFFER_PARTS.some(x=>x.ref===p.ref))].map(p=>`<div class="partrow" data-part="${esc((p.ref+' '+p.name).toLowerCase())}"><div class="part-info"><strong>${esc(p.name)}</strong><small>Réf. ${esc(p.ref)}${p.category?' · '+esc(p.category):''}</small></div><label>Qté <input id="partqty-${esc(p.ref)}" type="number" min="1" step="1" value="1"></label><button class="btn small" onclick="addOfferPart('${esc(p.ref)}','${esc(p.name).replace(/'/g,'&#39;')}')">+ Ajouter</button></div>`).join('')}</div><details class="manualpart"><summary>+ Ajouter une pièce par sa référence</summary><div class="formgrid"><div class="field"><label>Référence</label><input id="custom-ref" placeholder="Référence Navision"></div><div class="field"><label>Désignation</label><input id="custom-name" placeholder="Nom de la pièce"></div><div class="field"><label>Quantité</label><input id="custom-qty" type="number" min="1" value="1"></div></div><button class="btn" onclick="addCustomOfferPart()">Ajouter la pièce</button></details><h3>Pièces sélectionnées (${offerDraft.parts.length})</h3>${offerDraft.parts.length?offerDraft.parts.map(p=>`<div class="item"><div class="itembody"><strong>${esc(p.name)}</strong><small>${esc(p.ref)} · Quantité : ${p.qty}</small></div><button class="btn danger small" onclick="removeOfferPart('${esc(p.ref)}')">Retirer</button></div>`).join(''):'<div class="empty">Aucune pièce sélectionnée.</div>'}`:`<div class="summarygrid"><div><span>Client</span><strong>${esc(offerDraft.client)}</strong></div><div><span>Distance</span><strong>${esc(offerDraft.distance)} km</strong></div><div><span>Zone</span><strong>${z.name}</strong></div><div><span>Nombre de bacs</span><strong>${offerDraft.bacs}</strong></div><div><span>Forfait</span><strong>${z.ref}</strong></div><div><span>Prix unitaire lissé</span><strong>${money(unit)}</strong></div></div><div class="notice">${offerDraft.bacs} × ${money(unit)} = ${money(total)} HT · Main-d'œuvre indicative : environ ${offerDraft.bacs*3} h</div><h3>Pièces à inclure dans l'e-mail</h3>${offerDraft.parts.length?offerDraft.parts.map(p=>`<div class="item"><div class="itembody"><strong>${esc(p.name)}</strong><small>${esc(p.ref)}</small></div><strong>× ${p.qty}</strong></div>`).join(''):'<div class="notice warning">Aucune pièce ajoutée. Vérifie avant d’envoyer.</div>'}<div class="notice">« Envoyer » ouvre ta messagerie avec un e-mail préparé pour Silvia. Aucun envoi automatique.</div>`}<div class="wizardactions">${offerStep>1?`<button class="btn secondary" onclick="offerBack()">← Précédent</button>`:'<button class="btn secondary" onclick="offerDraft=null;render()">Annuler</button>'}<div style="flex:1"></div>${offerStep<3?`<button class="btn" onclick="offerNext()">Suivant →</button>`:`<button class="btn secondary" onclick="saveOfferDraft()">Enregistrer</button><button class="btn" onclick="sendOfferDraft()">✉ Envoyer</button>`}</div></div>`}
function offers(){if(offerDraft)return `${hero('Offres','Demande de maintenance en trois étapes.')}${offerWizard()}`;return `${hero('Offres','Préparer les demandes de contrat de maintenance préventive.') }<div class="card"><div class="toolbar"><h2 style="flex:1;margin:0">Demandes de maintenance</h2><button class="btn" onclick="startOffer()">+ Nouvelle demande</button></div><div class="notice">Parcours : informations client → catalogue de pièces et quantités → résumé et e-mail.</div>${db.offers.length?db.offers.map(o=>`<div class="item"><div class="avatar">✉</div><div class="itembody"><strong>${esc(o.client)}</strong><small>${o.bacs} bac(s) · ${o.distance} km · ${esc(zone(o.distance).name)} · ${money(unitPrice(o.distance,o.bacs))} / bac</small></div><div class="actions"><button class="btn small" onclick="emailOffer('${o.id}')">✉ Mail</button><button class="btn secondary small" onclick="startOffer('${o.id}')">Modifier</button></div></div>`).join(''):'<div class="empty">Aucune demande créée.</div>'}</div>`}
function zone(distance){let d=Number(distance);return d<50?{name:'Zone proche',ref:'80000002',price:414.15}:d<=200?{name:'Zone moyenne',ref:'80000003',price:526.15}:{name:'Zone éloignée',ref:'80000004',price:821.15}}
function unitPrice(d,n){let z=zone(d),qty=Math.max(1,Number(n)||1);return Math.round(z.price*(1+.6*(qty-1))/qty*100)/100}
function emailOffer(id){let o=db.offers.find(x=>x.id===id);if(!o)return;let z=zone(o.distance),parts=(o.parts||[]).map(p=>`${p.qty} x ${p.ref} : ${p.name}`).join('\n');let subject=`Offre Contrat de maintenance préventive : ${o.client}`;let body=`Bonjour Silvia,\n\nPourrais tu établir une offre pour ${o.client} :\n\n"Contrat de maintenance sans engagement :"\n\n${z.name} :\n\n${o.bacs} x ${z.ref} : ${unitPrice(o.distance,o.bacs).toFixed(2).replace('.',',')} € / unité\n\n${parts}\n\nMerci\n\nPour info :\nContrat incluant environ ${Number(o.bacs)*3} heure(s) de m.o\n\nCordialement`;location.href=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}
function stocks(){let owners=['Bureau',...TECHS],list=db.stocks.filter(s=>s.owner===stockOwner&&(s.number+' '+s.short+' '+s.long).toLowerCase().includes(query.toLowerCase()));return `${hero('Matériel','Inventaires indépendants, stock minimum et réapprovisionnement.') }<div class="tabs">${owners.map(o=>`<button class="tab ${stockOwner===o?'active':''}" onclick="stockOwner='${o}';render()">${esc(o)}</button>`).join('')}</div><div class="card"><div class="toolbar">${searchBar('Référence ou désignation')}<button class="btn" onclick="openForm('stock')">+ Ajouter une pièce</button></div>${list.length?list.map(s=>`<div class="item"><div class="avatar">▣</div><div class="itembody"><strong>${esc(s.number)} · ${esc(s.short)}</strong><small>Stock : ${Number(s.qty)||0} · Minimum : ${Number(s.min)||0}${s.modified?` · Avant : ${s.previous} · ${new Date(s.modified).toLocaleString('fr-FR')}`:''}</small>${Number(s.qty)<Number(s.min)?'<span class="tag orange">Stock sous le minimum</span>':''}</div><div class="actions"><button class="btn secondary small" onclick="changeQty('${s.id}',-1)">−</button><strong>${Number(s.qty)||0}</strong><button class="btn secondary small" onclick="changeQty('${s.id}',1)">+</button><button class="btn secondary small" onclick="openForm('stock','${s.id}')">✎</button>${Number(s.qty)<Number(s.min)?`<button class="btn small" onclick="reorder('${s.id}')">✉</button>`:''}</div></div>`).join(''):'<div class="empty">Aucune pièce dans cet inventaire.</div>'}</div>`}
function changeQty(id,delta){let s=db.stocks.find(x=>x.id===id);if(!s)return;if(role!=='admin'&&s.owner!==selectedTech)return alert('Inventaire non autorisé.');let next=Math.max(0,Number(s.qty||0)+delta);if(next===Number(s.qty||0))return;s.previous=Number(s.qty||0);s.qty=next;s.modified=new Date().toISOString();save();render()}
function reorder(id){let s=db.stocks.find(x=>x.id===id);if(!s)return;let body=`Bonjour,\n\nPeux-tu prévoir le réapprovisionnement suivant pour l'inventaire ${s.owner} ?\n\n${s.number} - ${s.short}\nQuantité demandée : ${s.min}\nStock actuel : ${s.qty}\n\nMerci.`;location.href=`mailto:?subject=${encodeURIComponent('Réapprovisionnement inventaire '+s.owner)}&body=${encodeURIComponent(body)}`}
function configurator(){if(!configFamily)return `${hero('Configurateur Meler','Choisis une famille d’équipements. Le parcours « Installation standard » est volontairement exclu.') }<div class="grid">${FAMILIES.map(([id,ic,name,sub])=>`<button class="category" onclick="configFamily='${id}';render()"><span class="symbol">${ic}</span><strong>${name}</strong><small>${sub}</small></button>`).join('')}</div><div class="notice warning">Les références et compatibilités officielles doivent être renseignées ou importées avant toute utilisation commerciale. Aucune référence produit n'est inventée.</div>`;let f=FAMILIES.find(x=>x[0]===configFamily),list=db.catalog.filter(x=>x.family===configFamily&&(x.name+' '+x.ref+' '+x.description).toLowerCase().includes(query.toLowerCase()));return `${hero(f[2],f[3])}<div class="toolbar"><button class="btn secondary" onclick="configFamily='';render()">← Toutes les familles</button>${searchBar('Référence, modèle, caractéristique')}<button class="btn" onclick="openForm('product')">+ Ajouter une référence</button></div>${configFamily==='encolleurs'?`<div class="tabs"><span class="tag">Micron+ · Piston / Engrenage</span><span class="tag">B4 · Piston / Engrenage / NS</span></div>`:''}${configFamily==='tuyaux'?`<div class="notice">Règles de sélection à respecter : Ø intérieur 8 mm par défaut pour colle standard ; Ø 13 mm pour PUR. Vérifier les compatibilités de chaque référence.</div>`:''}${configFamily==='buses'?`<div class="notice">Filtres métier : cordon, point, fibérisation, diamètre, angle, nombre d'orifices et compatibilité applicateur.</div>`:''}<div class="productlist">${list.map(p=>`<div class="product"><div class="art">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" style="max-width:100%;max-height:100%;object-fit:contain">`:'⚙'}</div><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="tag">${esc(p.ref||'Référence à compléter')}</div><div class="toolbar"><button class="btn small secondary" onclick="openForm('product','${p.id}')">Détails / modifier</button></div></div>`).join('')}</div>${!list.length?`<div class="empty">Aucune référence importée pour cette famille. Ajoute tes données réelles pour alimenter le configurateur.</div>`:''}`}
function calendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),start=new Date(y,m,1),first=(start.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let entries=db.interventions.filter(i=>['À planifier','Planifié'].includes(i.status));function events(d){let day=dateISO(d);return entries.filter(i=>i.start&&day>=i.start&&day<=(i.end||i.start))}let monthCells=Array.from({length:Math.ceil((first+days)/7)*7},(_,n)=>{let d=new Date(y,m,n-first+1);return `<div class="calday ${d.getMonth()!==m?'muted':''}"><strong>${d.getDate()}</strong>${events(d).map(i=>`<div class="event" title="${esc(i.client)}" onclick="openForm('intervention','${i.id}')">${i.contacted?'✓ ':''}${esc(i.client)}</div>`).join('')}</div>`}).join('');let monday=new Date(calDate);monday.setDate(calDate.getDate()-(calDate.getDay()+6)%7);return `${hero('Calendrier','Vue mensuelle ou planning hebdomadaire par technicien, sans glisser-déposer.') }<div class="card"><div class="toolbar"><button class="btn secondary small" onclick="moveCal(-1)">←</button><strong style="flex:1;text-align:center">${calMode==='month'?MONTHS[m]+' '+y:'Semaine du '+dateFR(dateISO(monday))}</strong><button class="btn secondary small" onclick="moveCal(1)">→</button><button class="btn secondary small" onclick="calDate=new Date();render()">Aujourd'hui</button><button class="btn ${calMode==='month'?'':'secondary'} small" onclick="calMode='month';render()">Mois</button><button class="btn ${calMode==='week'?'':'secondary'} small" onclick="calMode='week';render()">Semaine</button></div>${calMode==='month'?`<div class="calgrid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div style="text-align:center;font-size:12px;font-weight:700;padding:7px">${x}</div>`).join('')}${monthCells}</div>`:`<div class="weekscroll"><table class="weektable"><tr><th>Technicien</th>${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);return `<th>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][n]} ${d.getDate()}</th>`}).join('')}</tr>${TECHS.map(t=>`<tr><th>${esc(t)}</th>${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);return `<td>${events(d).filter(i=>i.tech===t).map(i=>`<div class="event" onclick="openForm('intervention','${i.id}')">${esc(i.client)}</div>`).join('')}</td>`}).join('')}</tr>`).join('')}</table></div><div class="weekmobile">${TECHS.map(t=>`<section class="techweek"><h3>${esc(t)}</h3><div class="weekdays">${Array.from({length:7},(_,n)=>{let d=new Date(monday);d.setDate(d.getDate()+n);let es=events(d).filter(i=>i.tech===t);return `<div class="weekday"><div class="dayhead">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][n]} <b>${d.getDate()}</b></div><div class="dayevents">${es.length?es.map(i=>`<button class="wevent" onclick="openForm('intervention','${i.id}')">${i.contacted?'✓ ':''}${esc(i.client)}</button>`).join(''):'<span class="nodate">—</span>'}</div></div>`}).join('')}</div></section>`).join('')}</div>`}</div>`}
function moveCal(delta){if(calMode==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()+delta,1);else{calDate=new Date(calDate);calDate.setDate(calDate.getDate()+7*delta)}render()}
function mapPage(){let list=db.interventions.filter(i=>['À planifier','Planifié'].includes(i.status)&&i.type!=='Atelier');return `${hero('Carte de France','Interventions positionnées selon les adresses des fiches clients.') }<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Localisation des clients</h2><button class="btn secondary small" onclick="initFranceMap(true)">↻ Actualiser les positions</button></div><div id="france-map" role="application" aria-label="Carte de France avec interventions"></div><p class="footnote" id="map-info">Carte OpenStreetMap. Les adresses des clients sont géocodées via Nominatim lors de l’affichage, puis mises en cache dans ce navigateur. Connexion Internet nécessaire.</p></div><div class="card"><h2>Interventions à localiser (${list.length})</h2>${list.map(i=>{let c=db.clients.find(c=>c.name===i.client);let a=[c?.address,c?.zip,c?.city].filter(Boolean).join(', ');return `<div class="item"><span class="dot ${i.status==='Planifié'?'green':''}"></span><div class="itembody"><strong>${esc(i.client)}</strong><small>${esc(i.status)} · ${esc(a||'Adresse client non renseignée')}</small></div><button class="btn secondary small" onclick="openForm('intervention','${i.id}')">Détails</button></div>`}).join('')||'<div class="empty">Aucune intervention planifiée ou à planifier.</div>'}</div>`}
let franceMap=null;async function initFranceMap(force=false){let el=document.getElementById('france-map');if(!el||typeof L==='undefined'){if(el)el.textContent='Carte indisponible hors connexion.';return}if(franceMap){franceMap.remove();franceMap=null}franceMap=L.map(el).setView([46.6,2.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(franceMap);let cache={};try{cache=JSON.parse(localStorage.getItem('techapp-geocodes')||'{}')}catch{}let items=db.interventions.filter(i=>['À planifier','Planifié'].includes(i.status)&&i.type!=='Atelier');let points=[];let count=0;for(let i of items){if(page!=='carte')break;let c=db.clients.find(c=>c.name===i.client);let addr=[c?.address,c?.zip,c?.city].filter(Boolean).join(', ');if(!addr)continue;let pos=cache[addr];if(!pos||force){try{await new Promise(r=>setTimeout(r,1100));let response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(addr));if(!response.ok)continue;let results=await response.json();if(!results.length)continue;pos=[Number(results[0].lat),Number(results[0].lon)];cache[addr]=pos;localStorage.setItem('techapp-geocodes',JSON.stringify(cache))}catch{continue}}let marker=L.circleMarker(pos,{radius:9,color:'#fff',weight:2,fillColor:i.status==='Planifié'?'#1caa79':'#ed9a26',fillOpacity:1}).addTo(franceMap);let node=document.createElement('div');let title=document.createElement('strong');title.textContent=i.client;node.append(title,document.createElement('br'),document.createTextNode(i.status+' · '+i.type),document.createElement('br'));let btn=document.createElement('button');btn.textContent='Ouvrir la fiche';btn.onclick=()=>openForm('intervention',i.id);node.append(btn);marker.bindPopup(node);points.push(pos);count++}if(points.length>1)franceMap.fitBounds(points,{padding:[35,35],maxZoom:9});else if(points.length===1)franceMap.setView(points[0],10);let info=document.getElementById('map-info');if(info)info.textContent=count+' intervention(s) localisée(s) sur '+items.length+'. Orange : à planifier · Vert : planifiée. Les adresses sont transmises à OpenStreetMap/Nominatim pour localisation.'}

function openSettings(){modal={type:'settings'};render()}
function openForm(type,id){interventionPhotosDraft=null;modal={type,id};render()}
function closeModal(){modal=null;render()}
function field(name,label,value='',type='text',extra=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(name,label,values,value=''){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${values.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function area(name,label,value=''){return `<div class="field wide"><label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}">${esc(value)}</textarea></div>`}
async function addInterventionPhotos(event){let files=[...event.target.files];if(!files.length)return;for(let f of files){if(!f.type.startsWith('image/'))continue;try{let src=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1200/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.68))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(f)});interventionPhotosDraft??=[];interventionPhotosDraft.push(src)}catch(e){alert('Impossible de lire '+f.name)}}let target=document.getElementById('photo-previews');if(target)target.innerHTML=(interventionPhotosDraft||[]).map((src,n)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${n+1}"><button type="button" onclick="removeInterventionPhoto(${n})">×</button></div>`).join('')}
function removeInterventionPhoto(n){if(!interventionPhotosDraft)return;interventionPhotosDraft.splice(n,1);let target=document.getElementById('photo-previews');if(target)target.innerHTML=interventionPhotosDraft.map((src,k)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${k+1}"><button type="button" onclick="removeInterventionPhoto(${k})">×</button></div>`).join('')}
function modalHTML(){let {type,id}=modal;let source={objective:'objectifs',client:'clients',intervention:'interventions',offer:'offers',stock:'stocks',product:'catalog'}[type];let o=(db[source]||[]).find(x=>x.id===id)||{};let title={objective:'Offre commerciale',client:'Fiche client',intervention:'Intervention',offer:'Demande de maintenance',stock:'Pièce en inventaire',product:'Référence configurateur',settings:'Profil de démonstration'}[type];let body='';if(type==='settings')body=`<div class="notice warning">Le choix du profil simule les permissions dans ce prototype local. Il ne constitue pas une authentification sécurisée.</div>${selectField('role','Mode',['admin','technicien'],role)}${selectField('tech','Technicien',TECHS,selectedTech)}<div class="notice">Les photos des techniciens peuvent être ajoutées depuis un hébergement d’images, via une URL publique.</div>${TECHS.map((t,n)=>field('photo'+n,'URL photo · '+t,db.technicians[n]?.photo||'','url')).join('')}`;
if(type==='objective')body=field('client','Client',o.client)+field('number','N° Offre',o.number)+field('amount','Montant (€)',o.amount||'','number','step="0.01" min="0"')+selectField('type','Type',['Préventif','Pièces','Formation'],o.type||'Préventif')+selectField('month','Mois',MONTHS,o.month||MONTHS[new Date().getMonth()]);
if(type==='client')body=field('name','Nom du client',o.name)+field('number','N° client',o.number)+field('city','Ville',o.city)+field('zip','Code postal',o.zip)+field('address','Adresse',o.address)+field('contact','Contact',o.contact)+field('phone','Téléphone',o.phone,'tel')+field('market','Marché',o.market)+selectField('type','Type client',['End User','OEM','Distributeur','Autre'],o.type||'End User')+field('seller','Code vendeur',o.seller);
if(type==='intervention')body=selectField('client','Client',['',...db.clients.map(c=>c.name)],o.client||'')+selectField('tech','Technicien affecté',['',...TECHS],o.tech||'')+selectField('type','Type',TYPES,o.type||'Installation')+selectField('status','Statut',STATUSES,o.status||'À planifier')+field('start','Date début',o.start,'date')+field('end','Date fin',o.end,'date')+field('hours','Durée (heures)',o.hours||'','number','min="0" step="0.5"')+area('comment','Commentaire',o.comment)+`<div class="field wide"><label>Photos de l'intervention (iPhone ou ordinateur)</label><input id="intervention-photos" type="file" accept="image/*" multiple capture="environment" onchange="addInterventionPhotos(event)"><small>Ajoutez plusieurs photos. Les images sont compressées avant stockage local.</small><div id="photo-previews" class="photo-previews">${(o.photos||[]).map((src,n)=>`<div class="photo-preview"><img src="${esc(src)}" alt="Photo ${n+1}"><button type="button" onclick="removeInterventionPhoto(${n})">×</button></div>`).join('')}</div></div><div class="notice">Dernière modification : ${o.modified?new Date(o.modified).toLocaleString('fr-FR'):'—'}</div>`;
if(type==='offer')body=selectField('client','Client',['',...db.clients.map(c=>c.name)],o.client||'')+field('distance','Distance bureau/client (km)',o.distance??'','number','min="0"')+field('bacs','Nombre total de bacs',o.bacs||1,'number','min="1"')+area('bacTypes','Types de bacs (ex. B4 x 1, Micron x 2)',o.bacTypes)+`<div class="field wide"><label>Pièces choisies manuellement (une ligne : référence ; désignation ; quantité)</label><textarea name="partsText" placeholder="10100070 ; Filtre cuve B4 ; 2">${esc((o.parts||[]).map(p=>`${p.ref} ; ${p.name} ; ${p.qty}`).join('\n'))}</textarea></div><div class="notice">Forfait par bac : 1er à 100 %, suivants à 60 %. Le prix unitaire est lissé sur tous les bacs. Main-d'œuvre estimative : environ 3 h / bac.</div>`;
if(type==='stock')body=field('number','N° / Référence',o.number)+field('inventory','Inventario',o.inventory||stockOwner)+field('short','Descripción corta',o.short)+area('long','Descripción larga',o.long)+area('english','Descripción en Ingles',o.english)+field('min','Stock mini',o.min||0,'number','min="0"')+field('qty','Quantité actuelle',o.qty??0,'number','min="0"');
if(type==='product')body=selectField('family','Famille',FAMILIES.map(x=>x[0]),o.family||configFamily)+field('name','Désignation',o.name)+field('ref','Référence Navision',o.ref)+area('description','Description / compatibilité',o.description)+field('image','URL image produit (facultatif)',o.image||'','url');
if(type==='intervention'&&interventionPhotosDraft===null)interventionPhotosDraft=[...(o.photos||[])];let readonly=(type==='client'||type==='intervention')&&!canEdit();return `<div class="modalwrap" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>${id?'Modifier / consulter':'Ajouter'} · ${title}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitForm(event,'${type}','${id||''}')"><div class="modalbody"><div class="formgrid">${body}</div></div><div class="modalfoot"><button type="button" class="btn secondary" onclick="closeModal()">Fermer</button>${!readonly?`<button type="submit" class="btn">Enregistrer</button>`:''}</div></form></div></div>`}
function submitForm(event,type,id){event.preventDefault();let fd=new FormData(event.target),v=Object.fromEntries(fd.entries());if(type==='settings'){role=v.role;selectedTech=v.tech;TECHS.forEach((name,n)=>{db.technicians[n]={name,photo:v['photo'+n]||''}});save();closeModal();return}let collection={objective:'objectifs',client:'clients',intervention:'interventions',offer:'offers',stock:'stocks',product:'catalog'}[type];if(!collection)return;let old=db[collection].find(x=>x.id===id);let obj={...(old||{}),...v,id:id||uid()};if(type==='objective'){obj.amount=Number(v.amount||0);obj.ordered=old?.ordered||false}if(type==='intervention'){obj.photos=[...(interventionPhotosDraft||old?.photos||[])];interventionPhotosDraft=null;if(!v.client)return alert('Sélectionne un client.');if(v.start&&v.end&&v.end<v.start)return alert('La date de fin doit être postérieure à la date de début.');obj.zip=db.clients.find(c=>c.name===v.client)?.zip||'';obj.contacted=old?.contacted||false;obj.modified=new Date().toISOString()}if(type==='offer'){obj.distance=Number(v.distance||0);obj.bacs=Math.max(1,Number(v.bacs)||1);obj.parts=(v.partsText||'').split('\n').map(line=>line.split(';').map(s=>s.trim())).filter(x=>x[0]).map(x=>({ref:x[0],name:x[1]||'',qty:Math.max(1,Number(x[2])||1)}));delete obj.partsText}if(type==='stock'){obj.owner=old?.owner||stockOwner;obj.min=Number(v.min||0);obj.qty=Math.max(0,Number(v.qty||0));if(old&&obj.qty!==Number(old.qty||0)){obj.previous=Number(old.qty||0);obj.modified=new Date().toISOString()}}if(old)Object.assign(old,obj);else db[collection].push(obj);save();closeModal()}
function removeItem(collection,id){if(!confirm('Supprimer définitivement cet élément ?'))return;db[collection]=db[collection].filter(x=>x.id!==id);save();render()}
function exportObjectives(){const rows=db.objectifs.map(o=>({'Client':o.client,'N° offre':o.number,'Montant (€)':Number(o.amount),'Type':o.type,'Mois':o.month,'Statut':o.ordered?'Commandée':'Non commandée'}));let n=rows.length,done=db.objectifs.filter(o=>o.ordered),summary=[{'Indicateur':'Total offres','Valeur':n},{'Indicateur':'Montant offres en cours','Valeur':db.objectifs.filter(o=>!o.ordered).reduce((s,o)=>s+Number(o.amount||0),0)},{'Indicateur':'Nombre offres transformées','Valeur':done.length},{'Indicateur':'Montant total commandé','Valeur':done.reduce((s,o)=>s+Number(o.amount||0),0)},{'Indicateur':'Taux transformation (%)','Valeur':n?done.length/n*100:0}];if(typeof XLSX==='undefined'){alert('Le module Excel n’est pas disponible hors connexion. Connectez-vous à Internet pour exporter en .xlsx.');return}let wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Client':'','N° offre':'','Montant (€)':'','Type':'','Mois':'','Statut':''}]),ss=XLSX.utils.json_to_sheet(summary);ws['!cols']=[{wch:28},{wch:20},{wch:16},{wch:16},{wch:14},{wch:19}];ss['!cols']=[{wch:33},{wch:20}];XLSX.utils.book_append_sheet(wb,ws,'Toutes les offres');XLSX.utils.book_append_sheet(wb,ss,'Synthèse');XLSX.writeFile(wb,'TechApp_Objectif.xlsx')}
render();
</script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></body></html>
